openapi: 3.1.0

info:
  title: activitypub-mcp API
  version: 1.0.0
  description: |
    HTTP API for **activitypub-mcp** — a personal ActivityPub bot that follows and
    archives public posts, and exposes the archived data over a read-only REST API
    (and an equivalent MCP server).

    This document covers three surfaces:

    - **REST API** (`/api/v1`) — a read-only JSON API over the archived data,
      gated by an API key. Every endpoint mirrors an MCP tool and returns
      byte-identical data.
    - **ActivityPub federation** — the actor document, inbox, outbox and
      collections used by other fediverse servers.
    - **Discovery & health** — WebFinger, NodeInfo and a health probe.

    The HTML admin UI (`/admin/*`) and the MCP protocol endpoint (`/mcp`) are
    intentionally not modelled here: the former serves HTML forms, the latter
    speaks the MCP StreamableHTTP protocol rather than a REST contract.

    ## REST request methods

    Each `/api/v1` data endpoint accepts the same input three ways:

    - **GET** — parameters as a query string (`?actor_handle=@a@b&limit=5`);
      arrays are repeated or comma-separated. String values are coerced to the
      declared types.
    - **POST** — a JSON body identical to the MCP tool input.
    - **QUERY** (RFC 9110-style) — a JSON body identical to POST. OpenAPI cannot
      express the custom `QUERY` method, so only GET and POST are listed per
      endpoint; `QUERY` behaves exactly like POST.

    ## Errors

    REST endpoints return JSON `{ "error": string }` bodies with these statuses:

    - `400` — request failed schema validation (includes an `issues` array).
    - `401` — missing or invalid API key.
    - `404` — a referenced actor handle could not be resolved.
    - `500` — unexpected internal error.
    - `503` — the REST API is disabled (`REST_API_KEY` is not configured).
  license:
    name: ISC

servers:
  - url: https://{domain}
    description: Deployed instance
    variables:
      domain:
        default: bot.skvip.lol
        description: The instance domain (APP_DOMAIN).

tags:
  - name: REST API
    description: Read-only JSON API over archived ActivityPub/BookWyrm/Last.fm data.
  - name: ActivityPub
    description: Federation endpoints consumed by other fediverse servers.
  - name: Discovery
    description: WebFinger and NodeInfo discovery documents.
  - name: Health
    description: Liveness probe.

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ----------------------------------------------------------------- REST API
  /api/v1:
    get:
      tags: [REST API]
      summary: Discovery document
      description: |
        Machine-readable description of the REST API: every endpoint, the MCP tool
        it wraps, and its parameter names. Generated from the same table that
        defines the routes, so it never drifts.
      operationId: getDiscovery
      responses:
        "200":
          description: API description.
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: activitypub-mcp REST API
                  version:
                    type: string
                    example: v1
                  methods:
                    type: object
                    additionalProperties:
                      type: string
                  auth:
                    type: string
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: /api/v1/actor-posts
                        mcp_tool:
                          type: string
                          example: get_actor_posts
                        description:
                          type: string
                        params:
                          type: array
                          items:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Disabled"

  /api/v1/actor-posts:
    get:
      tags: [REST API]
      summary: Get posts from an actor
      description: |
        Posts from a specific ActivityPub actor. Defaults to newest-first; set
        `sort_order=asc` with `limit=1` for the earliest post, and follow
        `next_cursor` for deep traversal.

        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: getActorPostsGet
      parameters:
        - $ref: "#/components/parameters/ActorHandleRequired"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: since
          in: query
          description: ISO 8601 datetime — only posts after this time.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: ISO 8601 datetime — only posts before this time.
          schema: { type: string, format: date-time }
        - name: object_types
          in: query
          description: Filter by object type, e.g. `Note,Article`.
          schema: { type: array, items: { type: string } }
        - name: tag
          in: query
          description: |
            Only posts carrying this hashtag (case-insensitive, leading `#`
            optional), e.g. `togselfie`. Filtered in SQL so `limit` counts
            matching posts and pagination stays correct.
          schema: { type: string }
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorPostsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get posts from an actor (JSON body)
      operationId: getActorPostsPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActorPostsRequest" }
      responses:
        "200":
          description: Page of posts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorPostsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/actor-reading-status:
    get:
      tags: [REST API]
      summary: Get BookWyrm reading status for an actor
      description: |
        Reading status for an actor by querying the live shelf (`use_live=true`,
        default) or the local DB. BookWyrm shelf collections are bare Edition
        objects, so BOTH modes derive `started_date`/`finished_date`/`rating`
        from the actor's stored public statuses (day granularity; a "read"
        comment or a review marks the finish) — live mode merges those onto the
        authoritative shelf rows by Edition URL (title fallback) and adds
        `shelved_date` when the shelf carries it. Cover, pages and language are
        backfilled from the cached book metadata for enriched books (the live
        shelf remains ground truth for cover art). Returns one entry per book
        (title, authors, cover, shelf, dates, rating, bookwyrm_book_url, pages,
        language, shelved_date).
      operationId: getActorReadingStatusGet
      parameters:
        - $ref: "#/components/parameters/ActorHandleRequired"
        - name: status
          in: query
          schema:
            { type: string, enum: [reading, read, to-read, stopped-reading] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: use_live
          in: query
          description: Fetch the live shelf from the BookWyrm instance (ground truth) instead of local data.
          schema: { type: boolean, default: true }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Reading status entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReadingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get BookWyrm reading status (JSON body)
      operationId: getActorReadingStatusPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_handle]
              properties:
                include_hidden: { type: boolean, default: false }
                actor_handle: { type: string }
                status:
                  {
                    type: string,
                    enum: [reading, read, to-read, stopped-reading],
                  }
                limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
                use_live: { type: boolean, default: true }
      responses:
        "200":
          description: Reading status entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReadingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/actor-media:
    get:
      tags: [REST API]
      summary: Get posts with image/video attachments
      description: |
        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: getActorMediaGet
      parameters:
        - $ref: "#/components/parameters/ActorHandleRequired"
        - name: media_type
          in: query
          schema: { type: string, enum: [image, video, any], default: any }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: since
          in: query
          description: ISO 8601 datetime.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Posts with media attachments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorMediaResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get posts with image/video attachments (JSON body)
      description: |
        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: getActorMediaPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_handle]
              properties:
                actor_handle: { type: string }
                media_type:
                  { type: string, enum: [image, video, any], default: any }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
                since: { type: string, format: date-time }
      responses:
        "200":
          description: Posts with media attachments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActorMediaResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/search-actor-content:
    get:
      tags: [REST API]
      summary: Full-text search across stored posts
      description: |
        Case-insensitive substring search over post content and summary, for one
        actor or all followed actors.

        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: searchActorContentGet
      parameters:
        - name: query
          in: query
          required: true
          description: Search terms.
          schema: { type: string, minLength: 1 }
        - name: actor_handle
          in: query
          description: Scope to a specific actor; omit to search all followed actors.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: object_types
          in: query
          schema: { type: array, items: { type: string } }
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Full-text search across stored posts (JSON body)
      operationId: searchActorContentPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1 }
                actor_handle: { type: string }
                limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
                object_types: { type: array, items: { type: string } }
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/follows:
    get:
      tags: [REST API]
      summary: List followed actors
      description: The actors this server is following, with follow status.
      operationId: getFollowsGet
      parameters:
        - name: status
          in: query
          schema:
            {
              type: string,
              enum: [pending, accepted, rejected, all],
              default: accepted,
            }
      responses:
        "200":
          description: Follow records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Follow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: List followed actors (JSON body)
      operationId: getFollowsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  {
                    type: string,
                    enum: [pending, accepted, rejected, all],
                    default: accepted,
                  }
      responses:
        "200":
          description: Follow records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Follow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/activity-stats:
    get:
      tags: [REST API]
      summary: Aggregate statistics about stored posts
      operationId: getActivityStatsGet
      parameters:
        - name: actor_handle
          in: query
          description: Scope to an actor; omit for all.
          schema: { type: string }
        - name: since
          in: query
          description: ISO 8601 datetime.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Aggregate statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Aggregate statistics about stored posts (JSON body)
      operationId: getActivityStatsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_handle: { type: string }
                since: { type: string, format: date-time }
      responses:
        "200":
          description: Aggregate statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/hashtag-stats:
    get:
      tags: [REST API]
      summary: Aggregate hashtag usage for an actor
      description: |
        Hashtag analytics over stored posts: totals, a posts-with-hashtags ratio,
        top hashtags with per-tag first/last used, and top co-occurring pairs.
        Scoped by default to the configured OWNER_ACTOR when actor_handle is omitted.
      operationId: getHashtagStatsGet
      parameters:
        - name: actor_handle
          in: query
          description: Scope to an actor; omit for the configured owner (or all posts).
          schema: { type: string }
        - name: tag
          in: query
          description: Restrict the snapshot to posts carrying this hashtag.
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Top-N size for hashtags and co-occurring pairs.
          schema: { type: integer, minimum: 1, maximum: 200, default: 30 }
      responses:
        "200":
          description: Hashtag statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HashtagStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Aggregate hashtag usage for an actor (JSON body)
      operationId: getHashtagStatsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_handle: { type: string }
                tag: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                since: { type: string, format: date-time }
                limit: { type: integer, minimum: 1, maximum: 200, default: 30 }
      responses:
        "200":
          description: Hashtag statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HashtagStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/hashtag-trends:
    get:
      tags: [REST API]
      summary: Hashtag usage over time
      description: |
        Time series of hashtag usage bucketed by week, month, or year. Without a
        tag, each point reports total uses and distinct hashtags; with a tag, the
        per-period count for that hashtag. Series runs oldest to newest.
      operationId: getHashtagTrendsGet
      parameters:
        - name: actor_handle
          in: query
          description: Scope to an actor; omit for the configured owner (or all posts).
          schema: { type: string }
        - name: tag
          in: query
          description: Chart a single hashtag's count per period.
          schema: { type: string }
        - name: group_by
          in: query
          schema: { type: string, enum: [week, month, year], default: month }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Maximum number of periods returned (newest kept).
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        "200":
          description: Hashtag usage time series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HashtagTrendsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Hashtag usage over time (JSON body)
      operationId: getHashtagTrendsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_handle: { type: string }
                tag: { type: string }
                group_by:
                  { type: string, enum: [week, month, year], default: month }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                since: { type: string, format: date-time }
                limit: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        "200":
          description: Hashtag usage time series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HashtagTrendsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/engagement:
    get:
      tags: [REST API]
      summary: Live engagement counts for statuses
      description: |
        Current favourite/boost/reply counts for one or more public statuses,
        read live from each status's origin instance (Mastodon REST API first,
        ActivityPub collection totals as fallback). Accepts permalinks, AP
        object ids, or bare numeric ids resolved against OWNER_INSTANCE.
        NOTE: unless snapshot=false, every call — including GET — records a
        snapshot row per status; skip_unchanged=true suppresses writes identical
        to the latest snapshot. Failures are per-item, never the whole batch.
      operationId: getEngagementGet
      parameters:
        - name: statuses
          in: query
          required: true
          description: Status references; repeat the param or comma-separate.
          schema: { type: array, items: { type: string } }
        - name: snapshot
          in: query
          description: Record a snapshot row per successful read.
          schema: { type: boolean, default: true }
        - name: skip_unchanged
          in: query
          description: Skip the write when counts equal the latest snapshot.
          schema: { type: boolean, default: false }
        - name: prefer
          in: query
          description: Force a fetch path; `ap` swaps the fallback order.
          schema: { type: string, enum: [rest, ap], default: rest }
      responses:
        "200":
          description: Per-status engagement results, preserving input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Live engagement counts for statuses (JSON body)
      operationId: getEngagementPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statuses]
              properties:
                statuses: { type: array, items: { type: string } }
                snapshot: { type: boolean, default: true }
                skip_unchanged: { type: boolean, default: false }
                prefer: { type: string, enum: [rest, ap], default: rest }
      responses:
        "200":
          description: Per-status engagement results, preserving input order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngagementResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/engagement-trends:
    get:
      tags: [REST API]
      summary: Engagement history for one status
      description: |
        A status's stored engagement snapshots as a time series (needs at least
        one prior /engagement sample). Buckets by hour, day, week, or month;
        each point carries the latest counts observed in the bucket plus the
        delta vs the previous bucket. Deltas can be negative — favourites and
        boosts can be undone. Series runs oldest to newest.
      operationId: getEngagementTrendsGet
      parameters:
        - name: status
          in: query
          required: true
          description: One status reference (permalink, AP id, or bare id).
          schema: { type: string }
        - name: group_by
          in: query
          schema: { type: string, enum: [hour, day, week, month], default: day }
        - name: metric
          in: query
          description: Narrow the series to one count as `{value, delta}` points.
          schema:
            {
