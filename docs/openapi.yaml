    EngagementResultItem:
      type: object
      description: >-
        Success items carry the counts and snapshot state; failure items carry
        `error` (unresolved_origin | not_found | unauthorized |
        unsupported_software | rate_limited | fetch_failed) and `message`.
      properties:
        input: { type: string, description: The reference as passed in. }
        status_ap_id:
          type: string
          description: Canonical AP object id, as reported by the origin.
        status_id: { type: string, description: Origin-local status id. }
        origin: { type: string, description: Origin instance hostname. }
        url: { type: [string, "null"], description: Human-facing permalink. }
        favourites_count: { type: integer }
        reblogs_count: { type: integer }
        replies_count: { type: integer }
        quotes_count:
          {
            type: [integer, "null"],
            description: Null when the origin doesn't report quote counts.,
          }
        source:
          {
            type: string,
            enum: [rest, ap],
            description: "`ap` collection totals can under-report vs REST.",
          }
        sampled_at: { type: string, format: date-time }
        snapshot_id: { type: [string, "null"] }
        snapshot: { type: string, enum: [written, skipped_unchanged, disabled] }
        snapshot_error:
          {
            type: string,
            description: Set when the live read succeeded but the write failed.,
          }
        error: { type: string }
        message: { type: string }

    EngagementResponse:
      type: object
      properties:
        ok: { type: integer, description: Number of successful reads. }
        failed: { type: integer, description: Number of per-item failures. }
        results:
          type: array
          description: One item per input reference, in input order.
          items: { $ref: "#/components/schemas/EngagementResultItem" }

    EngagementTrendsResponse:
      type: object
      properties:
        status_ap_id: { type: string }
        group_by: { type: string, enum: [hour, day, week, month] }
        metric: { type: string, enum: [favourites, reblogs, replies, all] }
        series:
          type: array
          description: >-
            Oldest to newest. With metric=all each point carries every count
            plus `d_*` deltas vs the previous bucket; with a single metric,
            `value` and `delta`. First bucket's deltas are null; negative
            deltas are real (un-favourites, undone boosts).
          items:
            type: object
            properties:
              bucket: { type: string }
              sampled_at:
                {
                  type: string,
                  format: date-time,
                  description: When the bucket's latest snapshot was taken.,
                }
              favourites: { type: integer }
              reblogs: { type: integer }
              replies: { type: integer }
              quotes: { type: [integer, "null"] }
              d_favourites: { type: [integer, "null"] }
              d_reblogs: { type: [integer, "null"] }
              d_replies: { type: [integer, "null"] }
              d_quotes: { type: [integer, "null"] }
              value: { type: integer }
              delta: { type: [integer, "null"] }
        first_sampled_at: { type: [string, "null"], format: date-time }
        last_sampled_at: { type: [string, "null"], format: date-time }
        snapshot_count: { type: integer }

    RecentActivity:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        actorApId: { type: string }
        objectType: { type: [string, "null"] }
        receivedAt: { type: [string, "null"], format: date-time }

