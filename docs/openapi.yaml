                  }
                limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Reading pace analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingPaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/garden-pages:
    get:
      tags: [REST API]
      summary: List markus.plus "Tankehav" garden pages
      description: |
        Pages from the markus.plus "Tankehav" digital garden (an Obsidian
        Publish site): title, url, section, excerpt, image and an optional date
        per page, plus a section roll-up. Filter by `section`; dated pages sort
        by date, undated pages sort after alphabetically. Set
        `include_content=true` to also receive each page's full markdown text
        (`content`, frontmatter stripped; null when not yet synced —
        `content_missing` reports coverage). For a single page's full text
        (including the home page, path `/`, which this list omits) use
        `/garden-page`.
      operationId: getGardenPagesGet
      parameters:
        - name: section
          in: query
          description: Filter to one section (the first permalink segment, e.g. reisar, lesing, melding).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: include_content
          in: query
          description: Attach each page's full markdown text as `content` plus
            `content_fetched_at`. Responses can be large — filter by section or
            lower the limit when collecting incrementally.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Garden pages with a section roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPagesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: List markus.plus "Tankehav" garden pages (JSON body)
      operationId: getGardenPagesPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                section: { type: string }
                limit:
                  { type: integer, minimum: 1, maximum: 1000, default: 500 }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                include_content: { type: boolean, default: false }
      responses:
        "200":
          description: Garden pages with a section roll-up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPagesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/garden-page:
    get:
      tags: [REST API]
      summary: Get one garden page with its full markdown text
      description: |
        One markus.plus "Tankehav" garden page resolved by `path` (the
        permalink, e.g. `/reisar/interrail/2025`; `/` is the home page) or
        `url`. Returns the page metadata plus `content` (the complete note body
        as markdown, frontmatter stripped) and `content_fetched_at`. Content is
        served from a local cache synced every 6h from Obsidian Publish; a
        missing page is fetched live once. `content` is null with
        `content_error` set if the source is currently unreachable.
      operationId: getGardenPageGet
      parameters:
        - name: path
          in: query
          description: Permalink path, e.g. /reisar/interrail/2025 (leading slash optional; "/" for the home page).
          schema: { type: string }
        - name: url
          in: query
          description: Full markus.plus URL. Alternative to path.
          schema: { type: string, format: uri }
      responses:
        "200":
          description: The garden page with its full text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get one garden page with its full markdown text (JSON body)
      operationId: getGardenPagePost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
                url: { type: string, format: uri }
      responses:
        "200":
          description: The garden page with its full text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GardenPageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/books:
    get:
      tags: [REST API]
      summary: Browse all cached books
      description: |
        The cached BookWyrm book catalogue as a paginated list of compact rows
        (book_url, title, subtitle, author, series, pages, physical_format, isbn13/isbn10,
        pub_year, language, publisher, cover_url, subjects, shelf, shelves,
        fetched_at). Call `/book-details` for the full record (description,
        provenance) of one book. Filter by `title` (partial match), `author`
        (partial match), `format`, `language`, `series` (partial match),
        `subject` (partial match against any subject/genre), or `shelf`.

        **This endpoint is a per-edition bibliographic cache, not a shelf.**
        Unfiltered it returns every book ever enriched — including ones still
        being read and ones started and put down. Pass `shelf=read` for finished
        books only. A `shelf` filter returns 404 rather than an empty page when
        shelf membership has not been synced yet, because an empty page cannot be
        told apart from "no books are on that shelf".

        Most-recently-enriched first by default; each response carries `total`
        (matching books across all pages) and a `next_cursor` for deep traversal.
      operationId: getBooksGet
      parameters:
        - name: title
          in: query
          description: Case-insensitive partial title match.
          schema: { type: string }
        - name: author
          in: query
          description: Case-insensitive partial author match.
          schema: { type: string }
        - name: format
          in: query
          description: Exact physical_format, e.g. Paperback, Hardcover, GraphicNovel, AudiobookFormat.
          schema: { type: string }
        - name: language
          in: query
          description: Exact language (normalized ISO-639-1 code, e.g. en, no).
          schema: { type: string }
        - name: series
          in: query
          description: Case-insensitive partial series-name match.
          schema: { type: string }
        - name: subject
          in: query
          description: Case-insensitive partial match against any of the book's subjects.
          schema: { type: string }
        - name: shelf
          in: query
          description: >-
            Books a tracked BookWyrm actor currently has on this shelf.
            `stopped-reading` is the ones started and put down without finishing;
            `unknown` is the inverse of all four — cached editions with no live
            shelf membership. Omit for every cached book regardless of shelf.
          schema:
            {
              type: string,
              enum: [read, reading, to-read, stopped-reading, unknown],
            }
        - $ref: "#/components/parameters/SortOrder"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: page
          in: query
          description: Offset-based page (legacy). Ignored when `cursor` is supplied.
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/Cursor"
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Page of books.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Browse all cached books (JSON body)
      operationId: getBooksPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_hidden: { type: boolean, default: false }
                title: { type: string }
                author: { type: string }
                format: { type: string }
                language: { type: string }
                series: { type: string }
                subject: { type: string }
                shelf:
                  {
                    type: string,
                    enum: [read, reading, to-read, stopped-reading, unknown],
                  }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
                cursor: { type: string }
      responses:
        "200":
          description: Page of books.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/watched:
    get:
      tags: [REST API]
      summary: Browse the cached NeoDB catalogue (all categories)
      description: |
        The cached NeoDB catalogue as a paginated list — every item behind this
        server's stored NeoDB marks ("finished watching …", "played …", "listened
        to …", "read …"), enriched from the catalog item the mark only links to.
        Covers ALL categories, filter with `category`: tv, movie, book, music, game,
        podcast, performance. Common fields on every row (item_url, category,
        item_type, title/display_title/orig_title, mark_titles, mark_comments, year, cover_url,
        description, genre, language, area, rating, external_resources, fetched_at);
        film/TV columns (season_number, episode_count, imdb + imdb_url, tmdb_url,
        director, actors); and a per-category `details` object (book author/isbn/pages/
        publisher + bookwyrm_book_url; music artist/release_date/track_count/barcode;
        game developer/publisher/platform; podcast host/feed_url; performance
        playwright/director/troupe/venue/opening_date). Filter by `title` (partial,
        matches the enriched title and the mark-supplied `mark_titles` aliases),
        `category`, `item_type`, `genre` (partial), exact `imdb` id, or
        `mark_comment` (partial, against the note(s) the mark(s) carried);
        `include_unenriched=true` also returns pending/failed rows (with fetch_error/
        fetch_attempts). Every row carries the shelf date — `watched_at` (when it was
        actually watched/read/played/listened to, NOT the post timestamp) and
        `watched_dates` (every distinct date across the item's live marks, newest
        first) — filterable with `watched_from`/`watched_to` or the `watched_year`
        sugar, and sortable with `sort_by=watched_at`. Most-recently-enriched first by
        default; each response carries `total` and a `next_cursor`. Use
        /catalogue-details for one item's full record + provenance.
      operationId: getWatchedGet
      parameters:
        - name: title
          in: query
          description: Case-insensitive partial title match.
          schema: { type: string }
        - name: category
          in: query
          description: Exact NeoDB category, e.g. tv, movie, book, music, game, podcast, performance.
          schema: { type: string }
        - name: item_type
          in: query
          description: Exact AP object type, e.g. Movie, TVSeason, Edition, Album, Game, Podcast, Performance.
          schema: { type: string }
        - name: genre
          in: query
          description: Case-insensitive partial match against any of the title's genres.
          schema: { type: string }
        - name: imdb
          in: query
          description: Exact IMDb id, e.g. tt27579939 (film/TV only).
          schema: { type: string }
        - name: mark_comment
          in: query
          description: >
            Case-insensitive substring match against the note(s) the mark(s) carried,
            e.g. "kino" finds everything marked "Sett på kino.". Free text — never
            parsed into categories.
          schema: { type: string }
        - name: status
          in: query
          description: >
            Only items whose NEWEST live mark carries this status. Positive, so it
            REQUIRES a tracked mark: an item enriched before the mark store existed has
            no status and is not returned. For "only what I actually finished", prefer
            `exclude_status`.
          schema:
            { type: string, enum: [wishlist, progress, complete, dropped] }
        - name: exclude_status
          in: query
          description: >
            Comma-separated statuses to drop, e.g. `dropped,progress`. Items with no
            tracked mark are KEPT — this removes only what is positively known, which is
            the safe direction given the mark store does not cover every enriched item.
          schema: { type: array, items: { type: string } }
          style: form
          explode: false
        - name: watched_from
          in: query
          description: >
            Only items with a mark watched/read/played on or after this date.
            `YYYY-MM-DD` anchors to that day's start in UTC; a full ISO timestamp is
            used verbatim. An item matches if ANY of its live marks falls in the window.
          schema: { type: string }
        - name: watched_to
          in: query
          description: >
            Only items with a mark watched/read/played on or before this date.
            `YYYY-MM-DD` covers that whole day in UTC (the bound is pushed to the
            following midnight, exclusive); a full ISO timestamp is compared inclusively.
          schema: { type: string }
        - name: watched_year
          in: query
          description: >
            Sugar for `watched_from`/`watched_to` spanning one calendar year in UTC,
            e.g. 2016 for "everything I watched in 2016". An explicit bound overrides
            it on that edge.
          schema: { type: integer, minimum: 1000, maximum: 9999 }
        - name: include_unenriched
          in: query
          description: Include rows not yet successfully enriched (pending/failed, carrying fetch_error/fetch_attempts).
          schema: { type: boolean, default: false }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
        - name: sort_by
          in: query
          description: >
            Which timestamp to order by. `fetched_at` (default) is enrichment time — for
            a backfilled import that is only the order the import ran in. `watched_at`
            orders by the item's newest shelf date; items with no date sort last in both
            directions.
          schema:
            {
              type: string,
              enum: [fetched_at, watched_at],
              default: fetched_at,
            }
        - $ref: "#/components/parameters/SortOrder"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: page
          in: query
          description: Offset-based page (legacy). Ignored when `cursor` is supplied.
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of catalogue items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Browse the cached NeoDB catalogue (JSON body)
      operationId: getWatchedPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                category: { type: string }
                item_type: { type: string }
                genre: { type: string }
                imdb: { type: string }
                mark_comment: { type: string }
                status:
                  {
                    type: string,
                    enum: [wishlist, progress, complete, dropped],
                  }
                exclude_status: { type: array, items: { type: string } }
                watched_from: { type: string }
                watched_to: { type: string }
                watched_year: { type: integer, minimum: 1000, maximum: 9999 }
                include_unenriched: { type: boolean, default: false }
                include_hidden: { type: boolean, default: false }
                sort_by:
                  {
                    type: string,
                    enum: [fetched_at, watched_at],
                    default: fetched_at,
                  }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
                cursor: { type: string }
      responses:
        "200":
          description: Page of catalogue items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/gigs:
    get:
      tags: [REST API]
      summary: Browse the concert log
      description: |
        The concert log as a paginated list — every gig behind this server's stored
        Gigowl (gigowl.social) attendances, enriched from the concert record the
        federated Note only links to.

        **Two dates, never interchangeable.** `gig_date` is the night of the gig and is
        what you almost always want; `logged_at` is when the attendance was posted, which
        for an imported archive is only the order the import ran in. A 2022 gig entered
        in 2026 has `gig_date` 2022 and `logged_at` 2026. `sort_by` defaults to
        `gig_date`, newest first.

        **RSVP state.** `rsvp_status` is interested/going/attended and `status_source`
        says where it came from: `tag` or `property` means the origin published it as
        data, `template` means it was read off the generated opening sentence —
        all that attendances logged before the origin published it as data carry. A state
        the parser did not recognise is null rather than a guess.

        **Setlists** are only ever as complete as the origin serves them: `song_count` is
        null for a gig nobody recorded one for, which is not the same as a gig with no
        songs. Filter with `has_setlist` and search within them with `song`.

        Each response carries `total` and a `next_cursor`. Use /gig-details for one gig's
        full record including its setlist, and /gig-stats for aggregates.
      operationId: getGigsGet
      parameters:
        - name: artist
          in: query
          description: Case-insensitive partial match against any name in the line-up, support acts included.
          schema: { type: string }
        - name: venue
          in: query
          description: Case-insensitive partial venue-name match.
          schema: { type: string }
        - name: city
          in: query
          description: Case-insensitive partial city match.
          schema: { type: string }
        - name: country
          in: query
          description: ISO 3166-1 alpha-2 country code, case-insensitive exact.
          schema: { type: string }
        - name: festival
          in: query
          description: Case-insensitive partial festival-name match. A festival day is an ordinary gig with many artists.
          schema: { type: string }
        - name: tour
          in: query
          description: Case-insensitive partial tour-name match.
          schema: { type: string }
        - name: song
          in: query
          description: Only gigs whose setlist contains this song (case-insensitive partial). A gig with no setlist can never match.
          schema: { type: string }
        - name: q
          in: query
          description: Free-text search over the gig title, its notes and any write-up about it.
          schema: { type: string }
        - name: status
          in: query
          description: RSVP state. Check `status_source` on the results before treating it as stated fact.
          schema: { type: string, enum: [interested, going, attended] }
        - name: concert_status
          in: query
          description: The concert's own status, which is about the event and not about attending it.
          schema:
            { type: string, enum: [scheduled, cancelled, postponed, completed] }
        - name: year
          in: query
          description: Sugar for from/to spanning one calendar year, on the NIGHT of the gig.
          schema: { type: integer, minimum: 1000, maximum: 9999 }
        - name: from
          in: query
          description: Only gigs on or after this date (YYYY-MM-DD), by the night of the gig.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Only gigs on or before this date (YYYY-MM-DD), by the night of the gig.
          schema: { type: string, format: date }
        - name: has_review
          in: query
          description: Only gigs somebody wrote up.
          schema: { type: boolean, default: false }
        - name: has_setlist
          in: query
          description: Only gigs with at least one song recorded.
          schema: { type: boolean, default: false }
        - name: include_unenriched
          in: query
          description: Include rows whose concert record has not been fetched successfully yet. Such a row has no title, date or line-up.
          schema: { type: boolean, default: false }
        - name: include_hidden
          in: query
          description: Include gigs an admin has hidden from the served catalogue.
          schema: { type: boolean, default: false }
        - name: sort_by
          in: query
          description: >
            Which date to order by. `gig_date` (default) is the night of the gig;
            `logged_at` is when the attendance was posted. Gigs with no date sort last in
            both directions.
          schema:
            { type: string, enum: [gig_date, logged_at], default: gig_date }
        - $ref: "#/components/parameters/SortOrder"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: page
          in: query
          description: Offset-based page (legacy). Ignored when `cursor` is supplied.
          schema: { type: integer, minimum: 1, default: 1 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of gigs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Browse the concert log (JSON body)
      operationId: getGigsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                artist: { type: string }
                venue: { type: string }
                city: { type: string }
                country: { type: string }
                festival: { type: string }
                tour: { type: string }
                song: { type: string }
                q: { type: string }
                status: { type: string, enum: [interested, going, attended] }
                concert_status:
                  {
                    type: string,
                    enum: [scheduled, cancelled, postponed, completed],
                  }
                year: { type: integer, minimum: 1000, maximum: 9999 }
                from: { type: string, format: date }
                to: { type: string, format: date }
                has_review: { type: boolean, default: false }
                has_setlist: { type: boolean, default: false }
                include_unenriched: { type: boolean, default: false }
                include_hidden: { type: boolean, default: false }
                sort_by:
                  {
                    type: string,
                    enum: [gig_date, logged_at],
                    default: gig_date,
                  }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
                cursor: { type: string }
      responses:
        "200":
          description: Page of gigs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/gig-details:
    get:
      tags: [REST API]
      summary: Get one gig's full record
      description: |
        One gig, resolved by `concert_url` (exact) or a partial `title` (the most recent
        match wins). Everything /gigs returns, plus the complete `setlists` array (per
        artist; each entry with position, setNumber, isEncore, songTitle, isCover,
        coverOfArtist and note — encores and covers are the two things a setlist is read
        for), the venue's own catalogue record when it has been fetched (aka names,
        coordinates, capacity, timezone, wikidata_qid, is_placeholder — a placeholder
        venue means the venue was genuinely not announced, not that data is missing),
        `source_map` (per-field provenance: `samklang-ap` or `samklang-jsonld`; the
        ActivityPub representation is the more complete of the two and wins wherever it
        spoke), and enrichment status.
      operationId: getGigDetailsGet
      parameters:
        - name: concert_url
          in: query
          description: The gig's canonical URL, exactly as /gigs returns it.
          schema: { type: string }
        - name: title
          in: query
          description: Alternatively, a case-insensitive partial title match.
          schema: { type: string }
        - name: include_hidden
          in: query
          description: Allow resolving a gig an admin has hidden.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The gig's full record, or an `error` field when nothing matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get one gig's full record (JSON body)
      operationId: getGigDetailsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                concert_url: { type: string }
                title: { type: string }
                include_hidden: { type: boolean, default: false }
      responses:
        "200":
          description: The gig's full record, or an `error` field when nothing matched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/gig-stats:
    get:
      tags: [REST API]
      summary: Aggregate the concert log
      description: |
        Totals (gigs, distinct artists/venues/cities/countries, first and last gig, gigs
        carrying a setlist or a write-up, songs on record) plus breakdowns `by_status`,
        `by_year` (by the night of the gig), `top_artists`, `top_venues`, `top_cities`
        and `top_songs`.

        `top_songs` and `songs_played` count only what a setlist records, so they are
        "songs I have a record of", never "songs I heard" — a gig nobody wrote a setlist
        for contributes nothing. Artist and venue totals are keyed on NAME, so two
        artists sharing a name count once.
      operationId: getGigStatsGet
      parameters:
        - name: status
          in: query
          description: Count only gigs with this RSVP state.
          schema: { type: string, enum: [interested, going, attended] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: year
          in: query
          description: Sugar for from/to spanning one calendar year.
          schema: { type: integer, minimum: 1000, maximum: 9999 }
        - name: top
          in: query
          description: How many entries in each of the top-N breakdowns.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: include_hidden
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Aggregate view of the concert log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Aggregate the concert log (JSON body)
      operationId: getGigStatsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [interested, going, attended] }
                from: { type: string, format: date }
                to: { type: string, format: date }
                year: { type: integer, minimum: 1000, maximum: 9999 }
                top: { type: integer, minimum: 1, maximum: 50, default: 10 }
                include_hidden: { type: boolean, default: false }
      responses:
        "200":
          description: Aggregate view of the concert log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GigStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/catalogue-details:
    get:
      tags: [REST API]
      summary: Get one NeoDB catalogue item's full record
      description: |
        One NeoDB catalogue item's full cached record, resolved by `item_url` (exact)
        or a partial `title` (most-recently-enriched wins; pass `category` to
        disambiguate). Returns the common fields, `watched_at`/`watched_dates` (the
        shelf date(s) — when it was watched/read/played, not when the mark was
        posted), film/TV columns, the category-specific `details` object, `bookwyrm_book_url` (book↔BookWyrm dedup link),
        `source_map` (per-field 'neodb'|'bookwyrm' provenance), and enrichment status
        (fetched_at, fetch_error, fetch_attempts, last_attempt_at). The catalogue
        sibling of /book-details.
      operationId: getCatalogueDetailsGet
      parameters:
        - name: item_url
          in: query
          description: NeoDB catalog URL (exact match, the primary key).
          schema: { type: string }
        - name: title
          in: query
          description: Case-insensitive partial title match (most-recently-enriched wins).
          schema: { type: string }
        - name: category
          in: query
          description: Optional category filter to disambiguate a title match.
          schema: { type: string }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The catalogue item's full record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get one NeoDB catalogue item's full record (JSON body)
      operationId: getCatalogueDetailsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_hidden: { type: boolean, default: false }
                item_url: { type: string }
                title: { type: string }
                category: { type: string }
      responses:
        "200":
          description: The catalogue item's full record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/book-details:
    get:
      tags: [REST API]
      summary: Get enriched metadata for one book
      description: |
        Full enriched metadata for one BookWyrm book from the local cache,
        resolved by `book_url` (the Edition AP id), `isbn` (13 or 10), or a
        partial `title`. Returns title, subtitle, author, series, pages, physical_format,
        isbn13/isbn10, pub_year, language, original_language, publisher,
        cover_url, description and subjects — each matched to the edition's
        resolved ISBN — plus isbn_source/page_source/source_map provenance.
        Provide at least one of book_url, isbn, or title.
      operationId: getBookDetailsGet
      parameters:
        - name: book_url
          in: query
          description: BookWyrm Edition AP id (exact match).
          schema: { type: string }
        - name: isbn
          in: query
          description: ISBN-13 or ISBN-10 (hyphens/spaces ignored).
          schema: { type: string }
        - name: title
          in: query
          description: Case-insensitive partial title match.
          schema: { type: string }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The enriched book metadata record, or an error object when not found.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get enriched metadata for one book (JSON body)
      operationId: getBookDetailsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_hidden: { type: boolean, default: false }
                book_url: { type: string }
                isbn: { type: string }
                title: { type: string }
      responses:
        "200":
          description: The enriched book metadata record, or an error object when not found.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/linkedin-posts:
    get:
      tags: [REST API]
      summary: Query LinkedIn posts with their latest performance numbers
      description: |
        Markus' LinkedIn archive. Post text, visibility and attached link come
        from LinkedIn's DMA Member Snapshot API (polled); impressions and
        engagements come from a monthly `.xlsx` export, joined on the post id.
        Neither source is a subset of the other, so a post may have text and no
        numbers yet (`latest_metrics: null`) or numbers and no text
        (`has_content: false`).

        `latest_metrics` carries the MOST RECENT export's figures, not a lifetime
        total — the export's impressions are a windowed accumulation. Use
        `/api/v1/linkedin-post` for the full observation series.
        `engagement_rate` is computed, not stored, and is null when impressions
        are 0 or engagements are unknown.

        Filter by publish date with `from`/`to` (calendar days, Europe/Oslo),
        by `visibility`, and by `has_metrics`. The archive is small, so paging is
        plain `page`/`limit` offsets with no cursor. REST serves publicly-visible
        posts only (ADR 0026); MCP sees the whole archive.
      operationId: getLinkedinPostsGet
      parameters:
        - {
            name: from,
            in: query,
            description: Published on or after this date.,
            schema: { type: string, format: date },
          }
        - {
            name: to,
            in: query,
            description: Published on or before this date.,
            schema: { type: string, format: date },
          }
        - {
            name: since,
            in: query,
            description: Alias for from.,
            schema: { type: string, format: date },
          }
        - {
            name: visibility,
            in: query,
            description: "LinkedIn's own visibility string, e.g. PUBLIC.",
            schema: { type: string },
          }
        - {
            name: has_metrics,
            in: query,
            description: true for posts with imported numbers; false for those still awaiting an export.,
            schema: { type: boolean },
          }
        - $ref: "#/components/parameters/SortOrder"
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
      responses:
        "200":
          description: Matching posts with their latest metrics attached.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Query LinkedIn posts (JSON body)
      operationId: getLinkedinPostsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                since: { type: string, format: date }
                visibility: { type: string }
                has_metrics: { type: boolean }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Matching posts with their latest metrics attached.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/linkedin-post:
    get:
      tags: [REST API]
      summary: Get one LinkedIn post with its full metric history
      description: |
        One post, resolved by `url` in either form LinkedIn uses — the
        `/feed/update/urn:li:activity:<id>` permalink or the
        `/posts/<slug>-ugcPost-<id>-<hash>` share link — or by the bare numeric
        `post_key`. All reduce to the same post.

        `metrics_history` is one row per monthly export, oldest first. Because the
        export's impressions are a windowed accumulation rather than a lifetime
        total, successive rows are genuinely different observations and the series
        is a reach-decay curve: a later row with fewer impressions means the post
        stopped being served, not that the earlier figure was wrong.

        Provide at least one of url or post_key. REST serves publicly-visible
        posts only.
      operationId: getLinkedinPostGet
      parameters:
        - {
            name: url,
            in: query,
            description: "The post URL, in either LinkedIn form.",
            schema: { type: string },
          }
        - {
            name: post_key,
            in: query,
            description: The numeric activity id.,
            schema: { type: string },
          }
      responses:
        "200":
          description: The post with its metric history, or an error object when not found.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Get one LinkedIn post (JSON body)
      operationId: getLinkedinPostPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                post_key: { type: string }
      responses:
        "200":
          description: The post with its metric history, or an error object when not found.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/linkedin-stats:
    get:
      tags: [REST API]
      summary: Aggregate LinkedIn performance, including median engagement rate per weekday
      description: |
        Totals, the p25/p75 spread for impressions and engagement rate, and
        `by_weekday` — the median engagement rate per weekday, which is the figure
        to use when reasoning about posting times.

        Medians rather than means, because one viral post otherwise decides the
        ranking; computed over each post's LATEST observation only, so a post that
        stayed in the top 50 for four months counts once rather than four times;
        bucketed by weekday in `Europe/Oslo`, so a post published at 00:30 CEST is
        not filed under the previous day.

        Every `by_weekday` bucket reports `n` (posts with a usable rate) beside its
        medians — a weekday can rest on one or two posts, and a ranking that
        ignores `n` will overstate what the data supports.

        `source_health` reports the state of the ingest. `ok` — data is flowing.
        `stale` / `unauthorized` — the numbers STOPPED moving at `last_success_at`,
        so a recent dip describes the outage rather than the audience.
        `awaiting_data` — the poller works but LinkedIn has never yet handed over
        the posts, so the numbers never STARTED: a thin result means the ingest has
        not begun. `never_run` — the poller is not configured. `last_data_at` is
        when posts actually last arrived, a different question from when the job
        last ran.

        `last_note`, `last_http_status` and `last_http_body` are written on every
        attempt, not only on failures — `last_error` and `last_status` stay empty
        while a source succeeds and returns nothing, which is precisely the state
        `awaiting_data` describes. `last_note` says what the run concluded and on
        what evidence, including the control-domain probe that separates a refused
        token from a collation delay.

        `join_health` reports whether the two halves are meeting. Content and
        performance are joined on an id extracted from each source's own URL
        spelling, so a namespace mismatch fills both tables and joins nothing
        while every query still returns rows: `matched: 0` with non-zero counts on
        both sides is that failure, not a backlog.

        REST aggregates publicly-visible posts only, so its figures can differ
        from the MCP tool's.
      operationId: getLinkedinStatsGet
      parameters:
        - {
            name: from,
            in: query,
            description: Published on or after this date.,
            schema: { type: string, format: date },
          }
        - {
            name: to,
            in: query,
            description: Published on or before this date.,
            schema: { type: string, format: date },
          }
        - {
            name: since,
            in: query,
            description: Alias for from.,
            schema: { type: string, format: date },
          }
      responses:
        "200":
          description: Totals, per-weekday medians, and ingest health.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Aggregate LinkedIn performance (JSON body)
      operationId: getLinkedinStatsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                since: { type: string, format: date }
      responses:
        "200":
          description: Totals, per-weekday medians, and ingest health.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  # ------------------------------------------------------------- Discovery
  /.well-known/webfinger:
    get:
      tags: [Discovery]
      summary: WebFinger lookup
      description: |
        Resolves the bot's account to its actor document. Only the bot's own account
        resolves. The response also links the human-readable profile page
        (`profile-page`) and the avatar.

        Accepts any spelling of the account, case-insensitively: the `acct:` URI, the
        bare `user@domain` handle, and the actor's URLs (`/actor`, `/@{username}`,
        `/users/{username}`). `subject` is always returned in the canonical `acct:`
        form, whichever was asked for.
      operationId: webfinger
      security: []
      parameters:
        - name: resource
          in: query
          required: true
          description: "Account URI or handle, e.g. `acct:bot@bot.skvip.lol`."
          schema: { type: string }
        - name: rel
          in: query
          required: false
          description: |
            Narrows the response to the given link relations. May be repeated. An
            unmatched value returns the subject with an empty `links` array.
          schema: { type: string }
      responses:
        "200":
          description: JRD document.
          content:
            application/jrd+json:
              schema: { $ref: "#/components/schemas/WebfingerJrd" }
        "400":
          description: Missing `resource` parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /.well-known/host-meta:
    get:
      tags: [Discovery]
      summary: Host-meta (XRD)
      description: |
        The pre-WebFinger discovery hop, carrying the LRDD template that points at
        `/.well-known/webfinger`. Friendica, GNU Social and several WebFinger clients
        fetch this first and give up on the account when it 404s.
      operationId: hostMeta
      security: []
      responses:
        "200":
          description: XRD document.
          content:
            application/xrd+xml:
              schema: { type: string }

  /.well-known/host-meta.json:
    get:
      tags: [Discovery]
      summary: Host-meta (JRD)
      description: The same LRDD template as `/.well-known/host-meta`, as JSON.
      operationId: hostMetaJson
      security: []
      responses:
        "200":
          description: JRD document.
          content:
            application/jrd+json:
              schema: { $ref: "#/components/schemas/HostMetaJrd" }

  /.well-known/nodeinfo:
    get:
      tags: [Discovery]
      summary: NodeInfo discovery
      description: |
        Points to the NodeInfo 2.0 and 2.1 documents. This is where the fediverse
        crawlers and instance-info lookups probe; the same document is also served at
        the bare `/nodeinfo` path.
      operationId: nodeinfoWellKnown
      security: []
      responses:
        "200":
          description: NodeInfo link document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInfoLinks" }

  /nodeinfo:
    get:
      tags: [Discovery]
      summary: NodeInfo discovery (alias)
      description: Identical to `/.well-known/nodeinfo`.
      operationId: nodeinfoIndex
      security: []
      responses:
        "200":
          description: NodeInfo link document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInfoLinks" }

  /nodeinfo/2.0:
    get:
      tags: [Discovery]
      summary: NodeInfo 2.0 document
      operationId: nodeinfo20
      security: []
      responses:
        "200":
          description: NodeInfo 2.0 document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInfo20" }

  /nodeinfo/2.1:
    get:
      tags: [Discovery]
      summary: NodeInfo 2.1 document
      description: NodeInfo 2.0 plus `software.repository`, which the 2.0 schema forbids.
      operationId: nodeinfo21
      security: []
      responses:
        "200":
          description: NodeInfo 2.1 document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInfo21" }

  # ------------------------------------------------------------ ActivityPub
  /actor:
    get:
      tags: [ActivityPub]
      summary: Actor document
      description: |
        The bot's ActivityPub actor document — typed `Service`, with the bio, profile
        metadata fields, avatar and header. Also available at `/users/{username}`
        (Mastodon-compatible alias), which always returns JSON.

        Content-negotiated: a request whose `Accept` header includes `text/html` gets
        the human-readable profile page instead. Anything else — including a vague
        `*/*` or no `Accept` at all — gets the actor document, so federation is
        unaffected.
      operationId: getActor
      security: []
      parameters:
        - name: Accept
          in: header
          required: false
          description: Include `text/html` to receive the profile page rather than JSON.
          schema: { type: string }
      responses:
        "200":
          description: Actor document, or the profile page for HTML clients.
          content:
            application/activity+json:
              schema: { $ref: "#/components/schemas/Actor" }
            text/html:
              schema: { type: string }

  "/@{username}":
    get:
      tags: [ActivityPub]
      summary: Human-readable profile page
      description: |
        The page a person lands on when they look the bot up: who operates it, what it
        archives, what it does not store about anyone else, and links to verify each
        claim. This is the URL the actor document advertises as `url`, and the
        `profile-page` link in the WebFinger response.

        HTML by default, being the human-facing URL. A caller that explicitly asks for
        ActivityPub and not HTML gets the actor document instead: Mastodon's URL search
        fetches this with `Accept: application/activity+json` and reports no results if
        it cannot reach the actor from here. The page also carries a
        `<link rel="alternate" type="application/activity+json">` for clients that only
        parse the HTML.
      operationId: getProfilePage
      security: []
      parameters:
        - name: username
          in: path
          required: true
          description: The configured `APP_USERNAME`.
          schema: { type: string }
        - name: Accept
          in: header
          required: false
          description: Ask for `application/activity+json` (without `text/html`) to get the actor document.
          schema: { type: string }
      responses:
        "200":
          description: Profile page, or the actor document for ActivityPub resolvers.
          content:
            text/html:
              schema: { type: string }
            application/activity+json:
              schema: { $ref: "#/components/schemas/Actor" }

  /assets/{image}.png:
    get:
      tags: [ActivityPub]
      summary: Profile avatar or header image
      description: |
        The PNGs referenced by the actor document's `icon` and `image`. Immutable and
        cached for a year; the actor document appends a `v` query carrying a hash of
        the file contents, so regenerated artwork gets a fresh URL and remote
        instances re-download it.
      operationId: getProfileAsset
      security: []
      parameters:
        - name: image
          in: path
          required: true
          schema: { type: string, enum: [avatar, header] }
        - name: v
          in: query
          required: false
          description: Content hash. Ignored by the server; present to bust remote caches.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: PNG image.
          content:
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: Not modified — the supplied `If-None-Match` matched the current hash.

  /actor/inbox:
    post:
      tags: [ActivityPub]
      summary: Actor inbox
      description: |
        Receives federated ActivityPub activities. The request must carry a valid
        HTTP Signature; the signature is verified against the sending actor's key.
        Also reachable at `/users/{username}/inbox` and the shared inbox `/inbox`.

        Activities are stored and acknowledged immediately, then processed
        asynchronously.
      operationId: postInbox
      security: []
      requestBody:
        required: true
        content:
          application/activity+json:
            schema: { $ref: "#/components/schemas/Activity" }
      responses:
        "202":
          description: Activity accepted for processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
        "400":
          description: Invalid JSON or missing activity id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: HTTP Signature verification failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /inbox:
    post:
      tags: [ActivityPub]
      summary: Shared inbox
      description: Server-wide shared inbox. Identical handling to `/actor/inbox`.
      operationId: postSharedInbox
      security: []
      requestBody:
        required: true
        content:
          application/activity+json:
            schema: { $ref: "#/components/schemas/Activity" }
      responses:
        "202":
          description: Activity accepted for processing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
        "400":
          description: Invalid JSON or missing activity id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: HTTP Signature verification failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /actor/outbox:
    get:
      tags: [ActivityPub]
      summary: Actor outbox
      description: |
        The notes the bot wrote itself, wrapped in public `Create` activities — the only
        content it ever publishes. The archive of the followed accounts' posts is
        private and never appears here.

        Without `page` this is the `OrderedCollection` itself, carrying `totalItems`,
        `first` and `last`. With `page` it is an `OrderedCollectionPage` (20 per page,
        newest-first) carrying `partOf` and, where applicable, `next` and `prev`.

        Also served under the Mastodon-style `/users/{username}/outbox` alias, which
        answers with the same canonical ids.
      operationId: getOutbox
      security: []
      parameters:
        - name: page
          in: query
          description: One-indexed page number. Omit to get the collection itself.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Ordered collection, or one page of it.
          content:
            application/activity+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderedCollection"
                  - $ref: "#/components/schemas/OrderedCollectionPage"

  /actor/featured:
    get:
      tags: [ActivityPub]
      summary: Featured (pinned) collection
      description: |
        The bot's pinned notes, embedded rather than listed as bare URIs. Mastodon
        fetches this whenever it discovers or refreshes the account and renders what it
        finds at the top of the profile — the one route by which a note of ours reaches
        someone else, given the bot has no followers to deliver to.

        Also served under `/users/{username}/featured`.
      operationId: getFeatured
      security: []
      responses:
        "200":
          description: Ordered collection of `Note` objects.
          content:
            application/activity+json:
              schema: { $ref: "#/components/schemas/OrderedCollection" }

  /notes/{id}:
    get:
      tags: [ActivityPub]
      summary: A single note
      description: |
        One of the bot's own notes. This URL is both the note's ActivityPub `id` and its
        web address, so it defaults to the ActivityPub object: a server dereferencing
        the id may send nothing more specific than `Accept: */*`, and HTML would fail
        ingestion. A request whose `Accept` includes `text/html` gets a readable page.
      operationId: getNote
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The note, as ActivityPub JSON or as HTML.
          content:
            application/activity+json:
              schema: { type: object }
            text/html:
              schema: { type: string }
        "404":
          description: No such note.

  /actor/followers:
    get:
      tags: [ActivityPub]
      summary: Followers collection
      description: Always empty — the bot does not accept followers.
      operationId: getFollowers
      security: []
      responses:
        "200":
          description: Empty ordered collection.
          content:
            application/activity+json:
              schema: { $ref: "#/components/schemas/OrderedCollection" }

  /actor/following:
    get:
      tags: [ActivityPub]
      summary: Following collection
      description: Public list of actors the bot follows (accepted follows only).
      operationId: getFollowing
      security: []
      responses:
        "200":
          description: Ordered collection of actor IDs.
          content:
            application/activity+json:
              schema: { $ref: "#/components/schemas/OrderedCollection" }

  # ------------------------------------------------------------------ Health
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Send the REST API key as `Authorization: Bearer <REST_API_KEY>`."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Alternative to Bearer: send the REST API key as `X-API-Key: <REST_API_KEY>`."

  parameters:
    ActorHandleRequired:
      name: actor_handle
      in: query
      required: true
      description: Actor handle (`@user@domain`) or full actor URL.
      schema: { type: string }
    SortOrder:
      name: sort_order
      in: query
      description: "`desc` (default) is newest-first; `asc` is oldest-first."
      schema: { type: string, enum: [asc, desc], default: desc }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response's `next_cursor`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Request failed schema validation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  issues:
                    type: array
                    items: { type: object }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The referenced actor handle could not be resolved.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Disabled:
      description: REST API disabled (`REST_API_KEY` not configured).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    # ---- REST request bodies ----
    ActorPostsRequest:
      type: object
      required: [actor_handle]
      properties:
        actor_handle:
          {
            type: string,
            description: Actor handle (`@user@domain`) or full actor URL.,
          }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        object_types: { type: array, items: { type: string } }
        tag:
          type: string
          description: |
            Only posts carrying this hashtag (case-insensitive, leading `#`
            optional), e.g. `togselfie`. Filtered in SQL so `limit` counts
            matching posts.
        sort_order: { type: string, enum: [asc, desc], default: desc }
        cursor: { type: string }

    # ---- REST response payloads ----
    Post:
      type: object
      properties:
        ap_id: { type: string }
        type: { type: string, example: Note }
        content: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        url: { type: [string, "null"] }
        in_reply_to: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date-time }
        attachments: { type: [array, "null"], items: { type: object } }
        tags: { type: [array, "null"], items: { type: object } }

    ActorPostsResponse:
      type: object
      properties:
        count: { type: integer }
        next_cursor: { type: [string, "null"] }
        sort_order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          properties:
            actor_handle: { type: string }
            since: { type: [string, "null"] }
            until: { type: [string, "null"] }
            object_types: { type: [array, "null"], items: { type: string } }
            tag: { type: [string, "null"] }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }

    ReadingStatus:
      type: object
      properties:
        title: { type: [string, "null"] }
        authors: { type: [string, "null"] }
        cover: { type: [string, "null"] }
        shelf:
          {
            type: [string, "null"],
            enum: [reading, read, to-read, stopped-reading, null],
          }
        started_date:
          {
            type: [string, "null"],
            description: Derived from the first public "reading" status (day granularity).,
          }
        finished_date:
          {
            type: [string, "null"],
            description: Derived from the "read" status or review that finished the book (day granularity).,
          }
        rating: { type: [string, "null"] }
        bookwyrm_book_url: { type: [string, "null"] }
        pages: { type: [integer, "null"] }
        language: { type: [string, "null"] }
        shelved_date:
          {
            type: [string, "null"],
            description: When the book was added to its shelf (live mode only; from the shelf item).,
          }

    BookSummary:
      type: object
      properties:
        book_url: { type: string }
        work_url: { type: [string, "null"] }
        title: { type: [string, "null"] }
        subtitle: { type: [string, "null"] }
        author:
          {
            type: [string, "null"],
            description: All authors as one comma-joined display string.,
          }
        series: { type: [string, "null"] }
        pages: { type: [integer, "null"] }
        physical_format: { type: [string, "null"] }
        isbn13: { type: [string, "null"] }
        isbn10: { type: [string, "null"] }
        pub_year: { type: [integer, "null"] }
        language: { type: [string, "null"] }
        original_language: { type: [string, "null"] }
        publisher: { type: [string, "null"] }
        cover_url: { type: [string, "null"] }
        subjects: { type: [array, "null"], items: { type: string } }
        shelf:
          type: [string, "null"]
          enum: [read, reading, to-read, stopped-reading, null]
          description: >-
            The shelf a tracked BookWyrm actor has this book on. Null when the book
            has no live shelf membership, or when two tracked actors disagree — read
            `shelves` to tell those apart.
        shelves:
          type: array
          items: { type: string }
          description: Every distinct live shelf this book sits on, across all tracked actors.
        fetched_at: { type: [string, "null"], format: date-time }

    BooksResponse:
      type: object
      properties:
        count: { type: integer }
        total:
          type: integer
          description: Total books matching the filters across all pages.
        page: { type: [integer, "null"] }
        next_cursor: { type: [string, "null"] }
        sort_order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          properties:
            title: { type: [string, "null"] }
            author: { type: [string, "null"] }
            format: { type: [string, "null"] }
            language: { type: [string, "null"] }
            series: { type: [string, "null"] }
            subject: { type: [string, "null"] }
            shelf: { type: [string, "null"] }
        books:
          type: array
          items: { $ref: "#/components/schemas/BookSummary" }

    WatchedTitle:
      type: object
      properties:
        item_url: { type: string }
        category: { type: [string, "null"] }
        item_type: { type: [string, "null"] }
        title: { type: [string, "null"] }
        display_title: { type: [string, "null"] }
        orig_title: { type: [string, "null"] }
        mark_titles:
          type: array
          items: { type: string }
          description: >
            The name(s) the mark(s) federated with, retained through NeoDB's
            localized-title overwrite (e.g. "Conflict" alongside the stored "Konflikt").
            Searched alongside `title`; [] when none.
        mark_comments:
          type: array
          items: { type: string }
          description: >
            The note(s) the mark(s) carried, verbatim — newest mark first, duplicates
            collapsed, deleted marks excluded. Free text in the marker's own words
            (e.g. "Sett på kino."), never parsed, normalised or translated. An item
            marked more than once (re-marked, or marked by several actors) carries one
            entry per distinct comment; [] when none. Filter with `mark_comment`.
        watched_at:
          type: [string, "null"]
          format: date-time
          description: >
            The shelf date — when the item was actually watched, read, played or listened
            to, taken from the mark's `relatedWith` Status. NOT the post timestamp: a 2016
            film backfilled today carries watched_at 2016 while its post's published_at is
            today. For an item marked more than once this is the newest of `watched_dates`.
            null when the mark carried no date.
        watched_dates:
          type: array
          items: { type: string, format: date-time }
          description: >
            Every distinct shelf date across the item's live marks, newest first, deleted
            marks excluded — plural like `mark_titles`/`mark_comments`, because an item can
            be re-watched or marked by more than one actor. [] when none.
        status:
          type: [string, "null"]
          enum: [wishlist, progress, complete, dropped, null]
          description: >
            The shelf state the item's NEWEST live mark carries. null when no live mark is
            tracked for the item — which is not the same as "not finished": items enriched
            before the mark store existed are grandfathered in and carry no status at all.
        status_raw:
          type: [string, "null"]
          description: The same mark's verb exactly as NeoDB sent it, so an unmapped one is never lost.
        statuses:
          type: array
          items: { type: string }
          description: >
            Every live mark's status, newest first — plural like `watched_dates`, because
            a re-mark is exactly how "progress" becomes "complete". [] when none.
        year: { type: [integer, "null"] }
        season_number: { type: [integer, "null"] }
        episode_count: { type: [integer, "null"] }
        imdb: { type: [string, "null"] }
        imdb_url: { type: [string, "null"] }
        tmdb_url: { type: [string, "null"] }
        cover_url: { type: [string, "null"] }
        description: { type: [string, "null"] }
        genre: { type: [array, "null"], items: { type: string } }
        director: { type: [array, "null"], items: { type: string } }
        actors: { type: [array, "null"], items: { type: string } }
        language: { type: [array, "null"], items: { type: string } }
        area: { type: [array, "null"], items: { type: string } }
        rating: { type: [number, "null"] }
        external_resources: { type: [array, "null"], items: { type: object } }
        details:
          type: object
          description: >
            Category-specific fields ({} for film/TV & unknown categories). book:
            author, isbn, pages, publisher; music: artist, release_date, track_count,
            barcode; game: developer, publisher, platform, release_date; podcast:
            host, feed_url; performance: playwright, director, troupe, venue,
            opening_date.
          additionalProperties: true
        bookwyrm_book_url:
          type: [string, "null"]
          description: For a NeoDB book deduped to a cached BookWyrm Edition by ISBN, that Edition's book_url; null otherwise.
        fetched_at: { type: [string, "null"], format: date-time }

    WatchedResponse:
      type: object
      properties:
        count: { type: integer }
        total:
          type: integer
          description: Total titles matching the filters across all pages.
        page: { type: [integer, "null"] }
        next_cursor: { type: [string, "null"] }
        sort_by: { type: string, enum: [fetched_at, watched_at] }
        sort_order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          properties:
            title: { type: [string, "null"] }
            category: { type: [string, "null"] }
            item_type: { type: [string, "null"] }
            genre: { type: [string, "null"] }
            imdb: { type: [string, "null"] }
            mark_comment: { type: [string, "null"] }
            status: { type: [string, "null"] }
            exclude_status: { type: [array, "null"], items: { type: string } }
            watched_from: { type: [string, "null"] }
            watched_to: { type: [string, "null"] }
            watched_year: { type: [integer, "null"] }
            watched_window:
              type: [object, "null"]
              description: >
                The window `watched_from`/`watched_to`/`watched_year` actually resolved to,
                so a caller can see that a bare `watched_to` date was taken as the whole day.
                null when no date filter was given.
              properties:
                from: { type: [string, "null"], format: date-time }
                to: { type: [string, "null"], format: date-time }
                to_exclusive:
                  type: boolean
                  description: true when `to` is the following midnight (a bare YYYY-MM-DD bound), false when it is the caller's own inclusive instant.
            include_unenriched: { type: boolean }
            include_hidden: { type: boolean }
        titles:
          type: array
          items: { $ref: "#/components/schemas/WatchedTitle" }

    Gig:
      type: object
      description: One gig from the concert log.
      properties:
        concert_url: { type: string }
        title:
          {
            type: [string, "null"],
            description: 'The composite title the origin renders: "Artist, Venue, City, DATE".',
          }
        gig_date:
          type: [string, "null"]
          format: date
          description: The night of the gig. The date to use for anything historical.
        start_at:
          type: [string, "null"]
          format: date-time
          description: >
            The instant the music started, when the origin knows the venue's timezone and
            the concert's start time. Absent for most of a backfilled archive, which is
            why `gig_date` exists separately and is what sorts.
        doors_time:
          {
            type: [string, "null"],
            description: Local wall clock in the venue's zone.,
          }
        concert_status:
          type: [string, "null"]
          enum: [scheduled, cancelled, postponed, completed, null]
        tour_name: { type: [string, "null"] }
        festival_name: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        venue:
          type: object
          properties:
            url: { type: [string, "null"] }
            name: { type: [string, "null"] }
            city: { type: [string, "null"] }
            country: { type: [string, "null"] }
        lineup:
          type: array
          description: role is headliner | opener | guest, or null when the origin served no roles.
          items:
            type: object
            properties:
              artistUrl: { type: [string, "null"] }
              name: { type: [string, "null"] }
              role: { type: [string, "null"] }
              position: { type: [integer, "null"] }
        artist_names: { type: array, items: { type: string } }
        rsvp_status:
          type: [string, "null"]
          enum: [interested, going, attended, null]
          description: The newest live attendance's RSVP state. null when nothing on the wire said.
        status_source:
          type: [string, "null"]
          enum: [tag, property, template, null]
          description: >
            Where `rsvp_status` came from. `tag`/`property` means the origin published it
            as data; `template` means it was read off the generated opening sentence and
            should be treated as derived.
        reviews:
          type: array
          description: The write-up(s), verbatim, newest first, duplicates collapsed. [] when none.
          items: { type: string }
        photos:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              altText: { type: [string, "null"] }
              mediaType: { type: [string, "null"] }
              width: { type: [integer, "null"] }
              height: { type: [integer, "null"] }
        song_count:
          type: [integer, "null"]
          description: null means nobody recorded a setlist, which is not the same as a gig with no songs.
        logged_at:
          type: [string, "null"]
          format: date-time
          description: When the attendance was posted. The paperwork, not the night.
        fetched_at: { type: [string, "null"], format: date-time }
        fetch_error:
          {
            type: [string, "null"],
            description: Only present with include_unenriched=true.,
          }
        fetch_attempts:
          {
            type: [integer, "null"],
            description: Only present with include_unenriched=true.,
          }

    GigsResponse:
      type: object
      properties:
        count: { type: integer }
        total:
          type: integer
          description: Total gigs matching the filters across all pages.
        page: { type: [integer, "null"] }
        next_cursor: { type: [string, "null"] }
        sort_by: { type: string, enum: [gig_date, logged_at] }
        sort_order: { type: string, enum: [asc, desc] }
        filters:
          type: object
          additionalProperties: true
        gigs:
          type: array
          items: { $ref: "#/components/schemas/Gig" }

    GigDetails:
      type: object
      description: One gig's full record, incl. its setlist, its venue and per-field provenance.
      properties:
        error:
          {
            type: string,
            description: Present instead of the record when nothing matched.,
          }
        concert_url: { type: string }
        title: { type: [string, "null"] }
        gig_date: { type: [string, "null"], format: date }
        start_at: { type: [string, "null"], format: date-time }
        doors_time: { type: [string, "null"] }
        concert_status: { type: [string, "null"] }
        tour_name: { type: [string, "null"] }
        festival_name: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        venue:
          type: object
          description: The venue's own catalogue record when it has been fetched; otherwise the denormalised subset carried on the gig.
          additionalProperties: true
        lineup:
          { type: array, items: { type: object, additionalProperties: true } }
        artist_names: { type: array, items: { type: string } }
        setlists:
          type: array
          description: One entry per artist with a recorded setlist. [] when the origin serves none.
          items:
            type: object
            properties:
              id: { type: [string, "null"] }
              artistUrl: { type: [string, "null"] }
              entries:
                type: array
                items:
                  type: object
                  properties:
                    position: { type: [integer, "null"] }
                    setNumber: { type: [integer, "null"] }
                    isEncore: { type: boolean }
                    songTitle: { type: string }
                    isCover: { type: boolean }
                    coverOfArtist: { type: [string, "null"] }
                    note: { type: [string, "null"] }
        song_count: { type: [integer, "null"] }
        rsvp_status: { type: [string, "null"] }
        status_source: { type: [string, "null"] }
        reviews: { type: array, items: { type: string } }
        photos:
          { type: array, items: { type: object, additionalProperties: true } }
        logged_at: { type: [string, "null"], format: date-time }
        details: { type: object, additionalProperties: true }
        source_map:
          type: object
          description: "Per-field provenance: samklang-ap or samklang-jsonld."
          additionalProperties: { type: string }
        enrichment:
          type: object
          properties:
            fetched_at: { type: [string, "null"], format: date-time }
            enriched_at: { type: [string, "null"], format: date-time }
            fetch_error: { type: [string, "null"] }
            fetch_attempts: { type: integer }
        hidden: { type: boolean }

    GigStats:
      type: object
      properties:
        filters:
          type: object
          additionalProperties: true
        totals:
          type: object
          properties:
            gigs: { type: integer }
            artists:
              type: integer
              description: Distinct artist NAMES across every line-up in range, so two artists sharing a name count once.
            venues: { type: integer }
            cities: { type: integer }
            countries: { type: integer }
            songs_played:
              type: integer
              description: Songs on record. Only ever as complete as the setlists are.
            gigs_with_setlist: { type: integer }
            gigs_with_review: { type: integer }
            first_gig: { type: [string, "null"], format: date }
            last_gig: { type: [string, "null"], format: date }
        by_status:
          type: array
          items:
            type: object
            properties:
              status: { type: [string, "null"] }
              gigs: { type: integer }
        by_year:
          type: array
          items:
            type: object
            properties:
              year: { type: string }
              gigs: { type: integer }
        top_artists:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              gigs: { type: integer }
        top_venues:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              city: { type: [string, "null"] }
              gigs: { type: integer }
        top_cities:
          type: array
          items:
            type: object
            properties:
              city: { type: string }
              gigs: { type: integer }
        top_songs:
          type: array
          description: Songs heard most often across recorded setlists — never a complete picture of what was played.
          items:
            type: object
            properties:
              song: { type: string }
              plays: { type: integer }

    CatalogueDetails:
      type: object
      description: One NeoDB catalogue item's full cached record, incl. per-field provenance.
      properties:
        item_url: { type: string }
        category: { type: [string, "null"] }
        item_type: { type: [string, "null"] }
        title: { type: [string, "null"] }
        display_title: { type: [string, "null"] }
        orig_title: { type: [string, "null"] }
        mark_titles:
          type: array
          items: { type: string }
          description: >
            The name(s) the mark(s) federated with, retained through NeoDB's
            localized-title overwrite (e.g. "Conflict" alongside the stored "Konflikt").
            Searched alongside `title`; origin recorded as 'activitypub' in source_map.
            [] when none.
        mark_comments:
          type: array
          items: { type: string }
          description: >
            The note(s) the mark(s) carried, verbatim — newest mark first, duplicates
            collapsed, deleted marks excluded. Free text in the marker's own words
            (e.g. "Sett på kino."), never parsed, normalised or translated. An item
            marked more than once (re-marked, or marked by several actors) carries one
            entry per distinct comment; [] when none.
        watched_at:
          type: [string, "null"]
          format: date-time
          description: >
            The shelf date — when the item was actually watched, read, played or listened
            to, taken from the mark's `relatedWith` Status. NOT the post timestamp: a 2016
            film backfilled today carries watched_at 2016 while its post's published_at is
            today. For an item marked more than once this is the newest of `watched_dates`.
            null when the mark carried no date.
        watched_dates:
          type: array
          items: { type: string, format: date-time }
          description: >
            Every distinct shelf date across the item's live marks, newest first, deleted
            marks excluded — plural like `mark_titles`/`mark_comments`, because an item can
            be re-watched or marked by more than one actor. [] when none.
        status:
          type: [string, "null"]
          enum: [wishlist, progress, complete, dropped, null]
          description: >
            The shelf state the item's NEWEST live mark carries. null when no live mark is
            tracked for the item — which is not the same as "not finished": items enriched
            before the mark store existed are grandfathered in and carry no status at all.
        status_raw:
          type: [string, "null"]
          description: The same mark's verb exactly as NeoDB sent it, so an unmapped one is never lost.
        statuses:
          type: array
          items: { type: string }
          description: >
            Every live mark's status, newest first — plural like `watched_dates`, because
            a re-mark is exactly how "progress" becomes "complete". [] when none.
        year: { type: [integer, "null"] }
        season_number: { type: [integer, "null"] }
        episode_count: { type: [integer, "null"] }
        imdb: { type: [string, "null"] }
        imdb_url: { type: [string, "null"] }
        tmdb_url: { type: [string, "null"] }
