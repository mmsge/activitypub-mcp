            schema:
              type: object
              required: [actor_handle]
              properties:
                include_hidden: { type: boolean, default: false }
                actor_handle: { type: string }
                year: { type: integer }
                from: { type: string }
                to: { type: string }
                sort:
                  {
                    type: string,
                    enum: [finished, fastest, slowest],
