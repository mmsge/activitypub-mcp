      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [line, crossing] }
                country: { type: string }
                travelled: { type: boolean }
                q: { type: string }
                limit: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: The registry, with travel totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RailwayLinesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/line-stats:
    get:
      tags: [REST API]
      summary: Travel statistics for one railway line or crossing
      description: |
        Trips, on-line kilometres, time aboard, first and last traversal, and a
        breakdown by year, operator or journey — for a single named line.

        For a bridge or tunnel it returns a **crossing count**: each traversal
        counted once, in either direction, so an out-and-back day trip counts two.

        Names resolve through aliases, case and diacritics — `Bergensbanen`,
        `Bergen Line` and `bergensbana` are one line, as are `Öresundsbron`,
        `Øresundsbroen` and `Öresundsbroa`. An unknown name returns `404` with the
        closest registry matches rather than an empty result.

        Trips that have not departed are excluded from the totals and listed
        separately under `upcoming`, so the trip currently under way counts but next
        month's does not. Every response states coverage and names any pinned routing
        behind the numbers.
      operationId: getLineStatsGet
      parameters:
        - {
            name: line,
            in: query,
            required: true,
            description: "Line or crossing name; aliases, case and diacritics all resolve.",
            schema: { type: string },
          }
        - { name: journey, in: query, schema: { type: string } }
        - { name: operator, in: query, schema: { type: string } }
        - { name: station, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - {
            name: include_planned,
            in: query,
            description: "Include trips that have not departed yet. Off by default.",
            schema: { type: boolean, default: false },
          }
        - {
            name: group_by,
            in: query,
            schema:
              { type: string, enum: [year, operator, journey], default: year },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Aggregates for the line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No line of that name; the closest matches are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineNotFoundResponse" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Travel statistics for one railway line or crossing (JSON body)
      operationId: getLineStatsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string }
                journey: { type: string }
                operator: { type: string }
                station: { type: string }
                mode: { type: string }
                status: { type: string }
                tag: { type: string }
                year: { type: integer }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                include_planned: { type: boolean, default: false }
                group_by:
                  {
                    type: string,
                    enum: [year, operator, journey],
                    default: year,
                  }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Aggregates for the line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No line of that name; the closest matches are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineNotFoundResponse" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/line-trips:
    get:
      tags: [REST API]
      summary: The legs that touched a railway line or crossing
      description: |
        The individual legs behind `/line-stats`, each with its prorated on-line
        distance and duration, its share of the whole trip, and how the routing was
        decided — so a total can be audited leg by leg.

        Rows carry the unscaled registry kilometres (`raw_route_km`) and the
        `scale_factor` applied to reach the trip's recorded `distance_km`, plus the
        reason for any pinned routing. Crossing rows are marked `crossed` and sit
        outside the distance partition, because their kilometres are already counted
        inside their carrier line's.
      operationId: getLineTripsGet
      parameters:
        - { name: line, in: query, required: true, schema: { type: string } }
        - { name: journey, in: query, schema: { type: string } }
        - { name: operator, in: query, schema: { type: string } }
        - { name: station, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - {
            name: include_planned,
            in: query,
            schema: { type: boolean, default: false },
          }
        - {
            name: sort_order,
            in: query,
            schema: { type: string, enum: [asc, desc], default: desc },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
      responses:
        "200":
          description: The legs that touched the line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineTripsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No line of that name; the closest matches are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineNotFoundResponse" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: The legs that touched a railway line or crossing (JSON body)
      operationId: getLineTripsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line]
              properties:
                line: { type: string }
                journey: { type: string }
                operator: { type: string }
                station: { type: string }
                mode: { type: string }
                status: { type: string }
                tag: { type: string }
                year: { type: integer }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                include_planned: { type: boolean, default: false }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: The legs that touched the line.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineTripsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No line of that name; the closest matches are returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineNotFoundResponse" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/trip-posts:
    get:
      tags: [REST API]
      summary: Posts made on a train trip
      description: |
        The posts made on a given train trip, and the trip a given post was made
        on — a derived join between the viaduct.world trips and the archived
        posts, matched on time. Each row carries the post plus its trip's
        stations, operator, rolling stock, distance and delay, and how the post
        relates to the trip: `boarding` (the 30 min before departure), `aboard`,
        or `alighting` (the 30 min after arrival).

        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: getTripPostsGet
      parameters:
        - name: journey
          in: query
          description: Journey/trip name (case-insensitive, partial match).
          schema: { type: string }
        - name: station
          in: query
          description: Origin or destination station (case-insensitive, partial).
          schema: { type: string }
        - name: operator
          in: query
          schema: { type: string }
        - name: relation
          in: query
          description: How the post relates to the trip.
          schema: { type: string, enum: [boarding, aboard, alighting] }
        - name: tag
          in: query
          description: Hashtag, leading `#` optional — e.g. `togselfie`.
          schema: { type: string }
        - name: object_ap_id
          in: query
          description: Look up one post and return the trip it was made on.
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: with_media_only
          in: query
          schema: { type: boolean, default: false }
        - name: sort_order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Posts bound to trips.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPostsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Posts made on a train trip (JSON body)
      description: |
        The posts made on a given train trip, and the trip a given post was made
        on — a derived join between the viaduct.world trips and the archived
        posts, matched on time. Each row carries the post plus its trip's
        stations, operator, rolling stock, distance and delay, and how the post
        relates to the trip: `boarding` (the 30 min before departure), `aboard`,
        or `alighting` (the 30 min after arrival).

        **Public posts only.** This endpoint serves posts the origin server
        marked public; followers-only, unlisted and unaddressed posts are
        withheld. The matching MCP tool returns the whole archive. See ADR 0026.
      operationId: getTripPostsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                journey: { type: string }
                station: { type: string }
                operator: { type: string }
                relation: { type: string, enum: [boarding, aboard, alighting] }
                tag: { type: string }
                object_ap_id: { type: string }
                year: { type: integer }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                with_media_only: { type: boolean, default: false }
                sort_order: { type: string, enum: [asc, desc], default: desc }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Posts bound to trips.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPostsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/reading-stats:
    get:
      tags: [REST API]
      summary: Aggregate reading statistics
      description: |
        Total/average/median page counts, reading span, ratings distribution and
        a per-format breakdown for an actor's BookWyrm books, plus a top-N
        breakdown by year, month, format, author, rating, series or subject
        (subject is multi-valued — a book counts once per subject). Page/format/
        year/series/subject data comes from cached BookWyrm Edition metadata;
        finish dates are derived from the actor's public statuses (a "read"
        comment or a review marks the finish). Defaults to the `read` shelf and
        `group_by=year`. Page averages are reported over books with known page
        counts (see `pages_coverage`); `avg_pages_prose` excludes comics/graphic
        novels and audiobooks.
      operationId: getReadingStatsGet
      parameters:
        - {
            name: actor_handle,
            in: query,
            required: true,
            schema: { type: string },
          }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum: [reading, read, to-read, stopped-reading],
                default: read,
              },
          }
        - {
            name: year,
            in: query,
            description: Scope to books finished in this calendar year. Omit for all-time.,
            schema: { type: integer },
          }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: rating, in: query, schema: { type: number } }
        - {
            name: group_by,
            in: query,
            schema:
              {
                type: string,
                enum: [year, month, format, author, rating, series, subject],
                default: year,
              },
          }
        - {
            name: limit,
            in: query,
            description: Number of top results.,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Aggregate reading metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Aggregate reading statistics (JSON body)
      operationId: getReadingStatsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_handle]
              properties:
                include_hidden: { type: boolean, default: false }
                actor_handle: { type: string }
                status:
                  {
                    type: string,
                    enum: [reading, read, to-read, stopped-reading],
                    default: read,
                  }
                year: { type: integer }
                from: { type: string }
                to: { type: string }
                format: { type: string }
                author: { type: string }
                rating: { type: number }
                group_by:
                  {
                    type: string,
                    enum:
                      [year, month, format, author, rating, series, subject],
                    default: year,
                  }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Aggregate reading metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingStatsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/reading-pace:
    get:
      tags: [REST API]
      summary: Reading pace and session analytics
      description: |
        Pace analytics over derived start→finish reading cycles (day
        granularity, from public statuses): per finished cycle
        `days_to_finish` and `pages_per_day`, reread detection (a book with
        multiple cycles), overlap periods where 2+ books were open at once,
        and summary aggregates (avg/median days to finish, avg pages/day,
        fastest/slowest, max concurrent books, `start_coverage`). Filter by
        `year`/`from`/`to` on the cycle's finish date.
      operationId: getReadingPaceGet
