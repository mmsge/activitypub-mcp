  /api/v1/post-breakouts:
    get:
      tags: [REST API]
      summary: Which posts are doing unusually well, relative to your own baseline
      description: |
        The state of the post-breakout notifier. For each watched account: where its
        own engagement bar sits (median / p90 / p99 over a rolling window, plus the
        all-time record), the thresholds a post must actually reach, which posts are
        armed to fire an alert right now, and which have already been announced.

        A post's score is `favourites*1 + reblogs*3 + replies*2` (configurable), and it
        is always the post's **peak** across its whole snapshot history rather than the
        latest reading — engagement counts go down, and a withdrawn favourite must not
        lower the bar or re-arm a spent rung.

        Baselines, thresholds and `armed` are computed live from the archive rather
        than read from the notifier's state, so this answers correctly even when
        notifications are unconfigured: `armed` non-empty with nothing arriving means
        the push is failing, not that nothing qualifies. `baseline.established` is
        false for an account with too few sampled posts for a percentile to mean
        anything — nothing fires there at all.

        NOTE: this endpoint serves public posts only, so its percentiles and lists are
        computed over public posts alone and can differ from the `get_post_breakouts`
        MCP tool, which sees the whole archive.
      operationId: getPostBreakouts
      parameters:
        - {
            name: actor_handle,
            in: query,
            description: Narrow to one account (@user@domain or an actor URL).,
            schema: { type: string },
          }
        - {
            name: days,
            in: query,
            description: How far back the recent list of announced breakouts reaches.,
            schema: { type: integer, minimum: 1, maximum: 365, default: 30 },
          }
        - {
            name: limit,
            in: query,
            description: Maximum rows in recent and in each account's armed list.,
            schema: { type: integer, minimum: 1, maximum: 200, default: 20 },
          }
      responses:
        "200":
          description: Baselines, armed posts and announced breakouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostBreakoutsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Which posts are doing unusually well (JSON body)
      operationId: getPostBreakoutsPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actor_handle: { type: string }
                days: { type: integer, minimum: 1, maximum: 365, default: 30 }
                limit: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: Baselines, armed posts and announced breakouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostBreakoutsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Disabled" }

  /api/v1/now-playing:
    get:
      tags: [REST API]
      summary: Currently-playing Last.fm track
      description: |
        A live read of the Last.fm user's currently-playing track (not a stored
        scrobble). Returns `{ nowPlaying: false }` when Last.fm answered and
        nothing is playing, and `{ nowPlaying: null, error }` when the upstream
        call failed or Last.fm is not configured — an outage is never reported as
        silence. Successful reads are briefly cached server-side; failures are not.

        Note that this stays `false` mid-song for a scrobbler that never sends
        `track.updateNowPlaying`, which is the common case here. That is an honest
        read of an upstream that has nothing to report, not a bug.
      operationId: getNowPlayingGet
      responses:
        "200":
          description: Current now-playing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NowPlayingResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Currently-playing Last.fm track (JSON body)
      operationId: getNowPlayingPost
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Current now-playing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NowPlayingResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }

