        book_finished_date:
          {
            type: [string, "null"],
            description: The book's derived overall finish date (last reading cycle's finish).,
          }
        rating: { type: [string, "null"] }
        review_title: { type: [string, "null"] }
        comment: { type: [string, "null"] }
        quote:
          {
            type: [string, "null"],
            description: The quoted passage (quotation events only; HTML stripped).,
