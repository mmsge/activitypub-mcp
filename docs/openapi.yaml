              {
                type: string,
                enum: [finished, fastest, slowest],
                default: finished,
              },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - name: include_hidden
          in: query
          description: Include rows an admin has hidden from the served catalogue. Off by default. Hidden rows still exist and are still enriched; they are suppressed from listings, not deleted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Reading pace analytics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingPaceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: Reading pace and session analytics (JSON body)
      operationId: getReadingPacePost
      requestBody:
