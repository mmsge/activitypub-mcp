          type: array
          items: { $ref: "#/components/schemas/Trip" }

    TripPostsResponse:
      type: object
      properties:
        count: { type: integer }
        page: { type: integer }
        sort_order: { type: string, enum: [asc, desc] }
        totals:
          type: object
