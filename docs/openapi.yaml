        top:
          type: array
          items:
            type: object
            properties:
              artist: { type: string }
              album: { type: string }
              track: { type: string }
              plays: { type: integer }
              image: { type: [string, "null"] }
        filters:
          type: object
          properties:
            artist: { type: [string, "null"] }
            album: { type: [string, "null"] }
            track: { type: [string, "null"] }
        range:
          type: object
          properties:
            from: { type: [string, "null"] }
            to: { type: [string, "null"] }

    BreakoutRung:
      type: string
      enum: [p90, p99, best]
      description:
        Which rung of the ladder. p90 = past the p90 of that account's own recent
        posts, p99 = past its p99, best = a personal best.

    PostBreakoutsResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: BREAKOUT_ENABLED. False means nothing will ever push.
        blocked_reason:
          type: [string, "null"]
          description:
            Why the notifier is inert, or null when it is armed. Distinguishes "switched
            off" from "no ntfy password", which look identical from the phone.
        topic: { type: string }
        weights:
          type: object
          properties:
            favourites: { type: number }
            reblogs: { type: number }
            replies: { type: number }
        floor:
          type: integer
          description:
            BREAKOUT_MIN_SCORE — the absolute floor every rung is lifted to, so a quiet
            fortnight cannot make a two-favourite post exceptional.
        min_posts: { type: integer }
        digest_hour:
          type: integer
          description: Europe/Oslo hour of the daily digest; -1 when disabled.
        fast_lane_minutes: { type: integer }
        actors:
          type: array
          items:
            type: object
            properties:
              actor: { type: string }
              actor_ap_id: { type: string }
              baseline:
                type: object
                description: The raw numbers. Percentiles are over the window; best is all-time.
                properties:
                  established:
                    type: boolean
                    description: False means nothing fires for this account at all.
                  reason:
                    type: [string, "null"]
                    enum: [no_posts, no_engagement_data, too_few_posts, null]
                    description: >
                      Why the account is not armed, when established is false. Three
                      different problems with three different fixes: no_posts means
                      nothing is being sampled at all (an ingest problem, not a
                      breakout one); no_engagement_data means posts ARE sampled but
                      every one scores zero and always has, because the origin does
                      not report favourite/boost/reply counts back — that account
                      will never fire, whatever the thresholds; too_few_posts is the
                      ordinary case of real engagement without enough history yet.
                  posts_in_window: { type: integer }
                  window_days: { type: integer }
                  median: { type: number }
                  p90: { type: number }
                  p99: { type: number }
                  best: { type: integer }
                  best_status_ap_id: { type: [string, "null"] }
                  second_best:
                    type: integer
                    description:
                      Runner-up, used as the record threshold when the candidate itself
                      holds the record — no post has to beat itself.
              thresholds:
                type: object
                description:
                  What a post must actually reach, after the floor is applied and the
                  rungs are forced strictly apart. These are the numbers the pushes quote.
                properties:
                  p90: { type: integer }
                  p99: { type: integer }
                  best: { type: integer }
              tracked_posts: { type: integer }
              armed:
                type: array
                description:
                  Posts clearing a rung further than anything already announced for
                  them. On a working deployment this empties within the hour.
                items:
                  type: object
                  properties:
                    status_ap_id: { type: string }
                    url: { type: [string, "null"] }
                    published_at: { type: [string, "null"], format: date-time }
                    visibility: { type: [string, "null"] }
                    score:
                      type: integer
                      description: Latest reading; can be below peak_score.
                    peak_score:
                      type: integer
                      description: High-water mark — what the rung is judged against.
                    favourites: { type: integer }
                    reblogs: { type: integer }
                    replies: { type: integer }
                    would_fire: { $ref: "#/components/schemas/BreakoutRung" }
                    spent_rung:
                      oneOf:
                        - { $ref: "#/components/schemas/BreakoutRung" }
                        - { type: "null" }
                    text: { type: [string, "null"] }
        recent:
          type: array
          description:
            Breakouts actually announced, newest first. A rung pre-marked when the post
            was first seen was never announced and does not appear here.
          items:
            type: object
            properties:
              status_ap_id: { type: string }
              actor: { type: string }
              url: { type: [string, "null"] }
              rung: { $ref: "#/components/schemas/BreakoutRung" }
              fired_at: { type: string, format: date-time }
              score:
                type: integer
                description: The score at which the rung was announced.
              peak_score: { type: integer }
              current_score:
                type: integer
                description:
                  What it is doing now. Below peak_score means engagement was withdrawn
                  — real, and deliberately not hidden. The rung is not taken back.
              visibility: { type: [string, "null"] }
              text: { type: [string, "null"] }

    ScrobbleRaceResponse:
      type: object
      properties:
        leader: { $ref: "#/components/schemas/RaceSide" }
        challenger: { $ref: "#/components/schemas/RaceSide" }
        gap:
          type: integer
          description: Leader's plays minus the challenger's. Negative once passed.
        leader_ahead: { type: boolean }
        plays_to_level: { type: integer }
        plays_to_overtake: { type: integer }
        pace:
          type: object
          properties:
            window_days: { type: integer }
            leader_plays_per_day: { type: number }
            challenger_plays_per_day: { type: number }
            net_closing_per_day: { type: number }
            projected_crossover_date:
              type: [string, "null"]
              format: date
              description: Null when the gap is not closing.
            projected_days: { type: [integer, "null"] }
        notifications:
          type: object
          description: State of the ntfy watcher for the configured pairing.
          properties:
            armed: { type: boolean }
            topic: { type: [string, "null"] }
            last_milestone: { type: [integer, "null"] }
            next_milestone: { type: [integer, "null"] }
            endgame_gap:
              type: integer
              description: >-
                The endgame countdown band (RACE_COUNTDOWN_GAP). At or below this gap the
                milestone ladder stands down and every challenger play that moves the
                number gets its own alert. 0 disables the countdown; the decisive alerts
                at gap 1 and gap 0, and the overtake, fire regardless.
            endgame_armed:
              type: boolean
              description: >-
                Whether the race has ever been observed inside the band. A latch, not a
                level — it stays true once set, including after the overtake.
            nowplaying_gap:
              type: integer
              description: >-
                Band for the optional live now-playing watcher (RACE_NOWPLAYING_GAP),
                which names the currently-playing track as the one about to tie or win.
                0 disables it; it requires a scrobbler that sends track.updateNowPlaying.
            overtaken_at:
              type: [string, "null"]
              format: date-time
              description: >-
                When the challenger took the lead — the playedAt of the play that did it,
                not the time the sync noticed. Written once and never overwritten.
        error:
          type: string
          description: Present when no race is configured and none was given.

    RaceSide:
      type: object
      properties:
        artist: { type: string }
        plays: { type: integer }
        last_played_at: { type: [string, "null"], format: date-time }
        last_track: { type: [string, "null"] }

    Trip:
      type: object
      properties:
        departureAt: { type: [string, "null"], format: date-time }
        arrivalAt: { type: [string, "null"], format: date-time }
        from: { type: string }
        to: { type: string }
        journey: { type: [string, "null"] }
        trainCode: { type: [string, "null"] }
        operator: { type: [string, "null"] }
        mode: { type: [string, "null"] }
        travelClass: { type: [string, "null"] }
        distanceKm: { type: [integer, "null"] }
        delay: { type: [integer, "null"] }
        night: { type: boolean }
        status: { type: [string, "null"] }
        tags: { type: [array, "null"], items: { type: string } }

