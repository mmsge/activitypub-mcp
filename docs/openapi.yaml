    get:
      tags: [REST API]
      summary: The named railway lines and crossings
      description: |
        Every named railway line and fixed link the archive knows about: canonical
        name, aliases, countries, registry length, and whether Markus has travelled
        it — with trip count, on-line kilometres, crossing count and first/last
        traversal for the ones he has.

        The registry is curated by hand rather than derived from OpenStreetMap
        tagging, so this is also the list of what `/line-stats` can answer for.
      operationId: listRailwayLinesGet
      parameters:
        - {
            name: kind,
            in: query,
            description: "Restrict to railway lines, or to named bridges and tunnels.",
            schema: { type: string, enum: [line, crossing] },
          }
        - {
            name: country,
            in: query,
            description: "ISO 3166-1 alpha-2 country code, e.g. NO, SE, GB.",
            schema: { type: string },
          }
        - {
            name: travelled,
            in: query,
            description: "true for entries Markus has been on, false for the rest. Omit for both.",
            schema: { type: boolean },
          }
        - {
            name: q,
            in: query,
            description: "Free-text filter over names and aliases.",
            schema: { type: string },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 100 },
          }
      responses:
        "200":
          description: The registry, with travel totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RailwayLinesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Disabled" }
    post:
      tags: [REST API]
      summary: The named railway lines and crossings (JSON body)
