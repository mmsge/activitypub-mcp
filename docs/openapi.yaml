        filters: { type: object }
        posts:
          type: array
          items:
            type: object
            properties:
              ap_id: { type: string }
              url: { type: [string, "null"] }
              content: { type: [string, "null"] }
              published_at: { type: [string, "null"], format: date-time }
              attachments: { type: array, items: { type: object } }
              relation: { type: string, enum: [boarding, aboard, alighting] }
              offset_seconds:
                type: [integer, "null"]
                description: |
                  Signed seconds from the trip's departure; negative while still
                  boarding.
              trip:
                type: object
                properties:
                  from: { type: string }
                  to: { type: string }
                  journey: { type: [string, "null"] }
                  operator: { type: [string, "null"] }
                  train_code: { type: [string, "null"] }
                  mode: { type: [string, "null"] }
                  distance_km: { type: [integer, "null"] }
                  delay: { type: [integer, "null"] }
                  night: { type: [boolean, "null"] }
                  departure_at: { type: string, format: date-time }
                  arrival_at: { type: [string, "null"], format: date-time }
    TrainStatsResponse:
      type: object
      properties:
        total_trips: { type: integer }
        total_km: { type: number }
        total_duration_seconds: { type: number }
        hours: { type: integer }
        minutes: { type: integer }
        distinct_stations: { type: integer }
        distinct_operators: { type: integer }
        distinct_journeys: { type: integer }
        first_trip_at: { type: [string, "null"], format: date-time }
        last_trip_at: { type: [string, "null"], format: date-time }
        group_by: { type: string, enum: [journey, operator, mode, year] }
        top:
          type: array
          items:
            type: object
            properties:
              key: { type: [string, "null"] }
              trips: { type: integer }
              km: { type: number }
        upcoming:
          type: [object, "null"]
          properties:
            from: { type: string }
            to: { type: string }
            date: { type: string }
            duration: { type: [string, "null"] }
        filters: { type: object }

    LineCoverage:
      type: object
      description: |
        How much of the archive has actually been placed on a line. Stated on every
        line response so a thin answer reads as "not resolved yet" rather than "he
        never went there".
      properties:
        trips: { type: integer }
        resolved: { type: integer }
        ambiguous:
          type: integer
          description: Two comparable routings; needs an override to choose between them.
        unresolved:
          type: integer
          description: No route in the curated registry — a ferry, or an uncurated corner of Europe.
        not_yet_resolved:
          type: integer
          description: Imported but the resolver has not reached them yet.
        stale:
          type: integer
          description: Resolved against an older registry; the next resolver run redoes them.
        unresolved_reasons:
          type: array
          items:
            type: object
            properties:
              status: { type: string, enum: [ambiguous, unresolved] }
              reason: { type: [string, "null"] }
              trips: { type: integer }

    RailwayLinesResponse:
      type: object
      properties:
        count: { type: integer }
        total_entries: { type: integer }
        registry_version: { type: string }
        coverage: { $ref: "#/components/schemas/LineCoverage" }
        filters: { type: object }
        lines:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              kind: { type: string, enum: [line, crossing] }
              aliases: { type: array, items: { type: string } }
              countries: { type: array, items: { type: string } }
              registry_length_km: { type: [number, "null"] }
              travelled: { type: boolean }
              trips: { type: integer }
              km: { type: number }
              seconds: { type: integer }
              first_at: { type: [string, "null"], format: date-time }
              last_at: { type: [string, "null"], format: date-time }
              carrier:
                type: [string, "null"]
                description: For a crossing, the line whose kilometres its span is measured in.
              notes: { type: [string, "null"] }

    LineStatsResponse:
      type: object
      properties:
        line:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            kind: { type: string, enum: [line, crossing] }
            matched:
              type: string
              description: The spelling that resolved, so a surprising hit is visible.
            registry_length_km: { type: [number, "null"] }
        trips: { type: integer }
        km: { type: number }
        seconds: { type: integer }
        hours: { type: integer }
        minutes: { type: integer }
        crossings:
          type: integer
          description: |
            Traversals of a named crossing, counted once each in either direction, so an
            out-and-back day trip counts two. Zero for a plain line.
        first_at: { type: [string, "null"], format: date-time }
        last_at: { type: [string, "null"], format: date-time }
        group_by: { type: string, enum: [year, operator, journey] }
        by:
          type: array
          items:
            type: object
            properties:
              key: { type: [string, "null"] }
              trips: { type: integer }
              km: { type: number }
              seconds: { type: integer }
              crossings: { type: integer }
        overrides_applied:
          type: array
          description: Every pinned routing behind these numbers, with its stated reason.
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              method: { type: string, enum: [override_pair, override_trip] }
              reason: { type: [string, "null"] }
        trips_by_override: { type: integer }
        upcoming:
          type: array
          description: Trips still to come on this line, kept out of the totals above.
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              journey: { type: [string, "null"] }
              date: { type: string }
              km: { type: number }
        coverage: { $ref: "#/components/schemas/LineCoverage" }
        filters: { type: object }

    LineTripsResponse:
      type: object
      properties:
        line:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            kind: { type: string, enum: [line, crossing] }
            matched: { type: string }
        count: { type: integer }
        total: { type: integer }
        page: { type: integer }
        sort_order: { type: string, enum: [asc, desc] }
        coverage: { $ref: "#/components/schemas/LineCoverage" }
        filters: { type: object }
        trips:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              journey: { type: [string, "null"] }
              operator: { type: [string, "null"] }
              mode: { type: [string, "null"] }
              status: { type: [string, "null"] }
              departure_at: { type: string, format: date-time }
              arrival_at: { type: [string, "null"], format: date-time }
              trip_distance_km: { type: [number, "null"] }
              on_line_km: { type: number }
              on_line_seconds:
                type: [integer, "null"]
                description: Prorated by distance share; the trip store holds no intermediate timings.
              share_of_trip: { type: [number, "null"] }
              crossed:
                type: boolean
                description: |
                  True on a crossing row. Crossing rows sit outside the distance
                  partition — their kilometres are already inside the carrier line's.
              resolved_via:
                {
                  type: [string, "null"],
                  enum: [kmposts, override_pair, override_trip, null],
                }
              override_reason: { type: [string, "null"] }
              raw_route_km:
                type: [number, "null"]
                description: The registry kilometres before scaling.
              scale_factor:
                type: [number, "null"]
                description: |
                  `distance_km / raw_route_km`. Stored rather than applied silently — a
                  split that needed a large nudge is one to distrust.

    LineNotFoundResponse:
      type: object
      description: An unknown line name comes back with the closest registry matches, never empty.
      properties:
        error: { type: string }
        did_you_mean:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              kind: { type: string, enum: [line, crossing] }

    ReadingStatsResponse:
      type: object
      properties:
        total_books: { type: integer }
        books_with_pages: { type: integer }
        pages_coverage:
          {
            type: string,
            description: e.g. "22/25 books with known page counts".,
          }
        total_pages: { type: integer }
        avg_pages: { type: [integer, "null"] }
        median_pages: { type: [integer, "null"] }
        avg_pages_prose:
          {
            type: [integer, "null"],
            description: Average over prose only (excludes comics/graphic novels and audiobooks).,
          }
        prose_books: { type: integer }
        first_finished_at: { type: [string, "null"], format: date }
        last_finished_at: { type: [string, "null"], format: date }
        rating:
          type: object
          properties:
            avg: { type: [number, "null"] }
            count: { type: integer }
            distribution:
              type: object
              additionalProperties: { type: integer }
        by_format:
          type: array
          items:
            type: object
            properties:
              format: { type: string }
              books: { type: integer }
              total_pages: { type: integer }
              avg_pages: { type: [integer, "null"] }
        group_by:
          {
            type: string,
            enum: [year, month, format, author, rating, series, subject],
          }
        top:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              books: { type: integer }
              total_pages: { type: integer }
              avg_pages: { type: [integer, "null"] }
        filters: { type: object }

    ReadingPaceCycle:
      type: object
      properties:
        title: { type: [string, "null"] }
        author: { type: [string, "null"] }
        book_url: { type: [string, "null"] }
        cycle:
          {
            type: integer,
            description: 1-based readthrough ordinal for this book; >1 is a reread.,
          }
        is_reread: { type: boolean }
        started_date: { type: [string, "null"], format: date }
        finished_date: { type: [string, "null"], format: date }
        days_to_finish:
          {
            type: [integer, "null"],
            description: Calendar days start→finish inclusive (same-day = 1); null without a known start.,
          }
        pages: { type: [integer, "null"] }
        pages_per_day: { type: [number, "null"] }

    ReadingPaceResponse:
      type: object
      properties:
        books:
          type: array
          items: { $ref: "#/components/schemas/ReadingPaceCycle" }
        summary:
          type: object
          properties:
            books_finished: { type: integer }
            avg_days_to_finish: { type: [integer, "null"] }
            median_days_to_finish: { type: [integer, "null"] }
            avg_pages_per_day: { type: [number, "null"] }
            fastest:
              type: [object, "null"]
              properties:
                title: { type: [string, "null"] }
                days: { type: [integer, "null"] }
            slowest:
              type: [object, "null"]
              properties:
                title: { type: [string, "null"] }
                days: { type: [integer, "null"] }
            rereads: { type: integer }
            max_concurrent_books: { type: integer }
            start_coverage:
              {
                type: string,
                description: e.g. "38/41 finished cycles with a known start date".,
              }
        overlaps:
          type: array
          items:
            type: object
            properties:
              books: { type: array, items: { type: string } }
              from: { type: string, format: date }
              to: { type: string, format: date }
        filters: { type: object }

    GardenPagesResponse:
      type: object
      properties:
        count:
          {
            type: integer,
            description: Number of pages returned (after filter + limit).,
          }
        total:
          {
            type: integer,
            description: Total pages in the garden (before filter).,
          }
        sections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              count: { type: integer }
        content_missing:
          type: integer
          description:
            Present only when include_content=true; number of returned pages
            whose content is not yet synced (content is null).
        pages:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string, format: uri }
              path:
                type: string
                description: Permalink, e.g. /reisar/interrail/2025
              section: { type: string }
              description: { type: [string, "null"] }
              image: { type: [string, "null"] }
              date: { type: [string, "null"] }
              tags:
                type: array
                items: { type: string }
              content:
                type: [string, "null"]
                description:
                  Present only when include_content=true. The page's full
                  markdown text (frontmatter stripped); null when the note has
                  not been synced yet.
              content_fetched_at:
                type: [string, "null"]
                format: date-time
                description:
                  Present only when include_content=true. When the content was
                  last fetched from Obsidian Publish.

    GardenPageResponse:
      type: object
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        path:
          type: string
          description: Permalink, e.g. /reisar/interrail/2025 ("/" is the home page).
        section:
          type: [string, "null"]
          description: Null for the home page, which the page list omits.
        description: { type: [string, "null"] }
        image: { type: [string, "null"] }
        date: { type: [string, "null"] }
        tags:
          type: array
          items: { type: string }
        content:
          type: [string, "null"]
          description:
            The complete note body as markdown (frontmatter stripped); null
            when the source is currently unreachable.
        content_fetched_at: { type: [string, "null"], format: date-time }
        content_error:
          type: [string, "null"]
          description: Last fetch error when content is null; null otherwise.

    # ---- ActivityPub / discovery ----
    WebfingerJrd:
      type: object
      properties:
        subject: { type: string }
        aliases:
          type: array
          items: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              rel: { type: string }
              type: { type: string }
              href: { type: string, format: uri }

    HostMetaJrd:
      type: object
      properties:
        links:
          type: array
          items:
            type: object
            properties:
              rel: { type: string, example: lrdd }
              type: { type: string, example: application/jrd+json }
              template:
                type: string
                example: https://bot.skvip.lol/.well-known/webfinger?resource={uri}

    NodeInfoLinks:
      type: object
      properties:
        links:
          type: array
          items:
            type: object
            properties:
              rel: { type: string }
              href: { type: string, format: uri }

    NodeInfo20:
      type: object
      properties:
        version: { type: string, example: "2.0" }
        software:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
        protocols:
          type: array
          items: { type: string }
        services:
          type: object
          description: Required by the schema even when empty — this host bridges no third-party service.
          properties:
            inbound: { type: array, items: { type: string } }
            outbound: { type: array, items: { type: string } }
        usage:
          type: object
          properties:
            users:
              type: object
              properties:
                total: { type: integer }
                activeMonth: { type: integer }
                activeHalfyear: { type: integer }
            localPosts:
              type: integer
              description: Notes the bot has published. 0 if the database is unreachable.
        openRegistrations: { type: boolean }
        metadata:
          type: object
          properties:
            nodeName: { type: string }
            nodeDescription: { type: string }

    NodeInfo21:
      allOf:
        - $ref: "#/components/schemas/NodeInfo20"
        - type: object
          properties:
            version: { type: string, example: "2.1" }
            software:
              type: object
              properties:
                name: { type: string }
                version: { type: string }
                repository: { type: string, format: uri }

    Actor:
      type: object
      description: ActivityPub actor document. Typed `Service`, because this is a bot.
      properties:
        "@context":
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: { type: string }
        id: { type: string, format: uri }
        type: { type: string, example: Service }
        preferredUsername: { type: string }
        name: { type: string }
        summary:
          type: string
          description: HTML bio — who operates the bot, what it archives, what it stores about others.
        url:
          type: string
          format: uri
          description: The human-readable profile page (`/@{username}`), not the actor id.
        published:
          type: string
          format: date-time
          description: When this actor went live, from `ACTOR_PUBLISHED`.
        manuallyApprovesFollowers:
          type: boolean
          description: Always `true`. Every incoming Follow is auto-rejected.
        discoverable: { type: boolean }
        attributedTo:
          type: string
          format: uri
          description: The operator's actor, from `OWNER_ACTOR`. Omitted when unset.
        attachment:
          type: array
          description: Profile metadata rows, as rendered by Mastodon. At most four.
          items:
            type: object
            properties:
              type: { type: string, example: PropertyValue }
              name: { type: string, example: Lagrar om deg }
              value: { type: string, example: Ingenting }
        icon: { $ref: "#/components/schemas/ActorImage" }
        image: { $ref: "#/components/schemas/ActorImage" }
        inbox: { type: string, format: uri }
        outbox: { type: string, format: uri }
        followers: { type: string, format: uri }
        following: { type: string, format: uri }
        endpoints:
          type: object
          properties:
            sharedInbox: { type: string, format: uri }
        publicKey:
          type: object
          properties:
            id: { type: string }
            owner: { type: string }
            publicKeyPem: { type: string }

    ActorImage:
      type: object
      description: Avatar or header image. Served from `/assets` with a content hash in the query.
      properties:
        type: { type: string, example: Image }
        mediaType: { type: string, example: image/png }
        url: { type: string, format: uri }

    Activity:
      type: object
      description: An ActivityPub activity (or bare object, which is wrapped in a synthetic `Create`).
      properties:
        "@context":
          oneOf:
            - type: string
            - type: array
              items: { type: object }
        id: { type: string, format: uri }
        type: { type: string, example: Create }
        actor: { type: string, format: uri }
        object:
          oneOf:
            - type: string
            - type: object
      required: [id, type]
      additionalProperties: true

    OrderedCollection:
      type: object
      properties:
        "@context": { type: string }
        id: { type: string, format: uri }
        type: { type: string, example: OrderedCollection }
        totalItems: { type: integer }
        orderedItems:
          type: array
          items: { type: string }

    OrderedCollectionPage:
      type: object
      properties:
        "@context": { type: string }
        id: { type: string, format: uri }
        type: { type: string, example: OrderedCollectionPage }
        partOf: { type: string, format: uri }
        orderedItems:
          type: array
          items: { type: object }
        next: { type: string, format: uri }
