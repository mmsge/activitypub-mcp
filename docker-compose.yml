services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: activitypub
      POSTGRES_USER: apuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuser -d activitypub"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://apuser:${DB_PASSWORD:-changepassword}@db:5432/activitypub
      NODE_ENV: production
      MEDIA_DIR: /data/media
    depends_on:
      db:
        condition: service_healthy
    # Bind only to localhost — TLS termination is handled by the central Caddy
    # instance in hetzner-server/Caddyfile which reverse-proxies to this port.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media_data:/data/media

volumes:
  postgres_data:
  media_data:
