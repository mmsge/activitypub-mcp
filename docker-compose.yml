services:
  db:
    # pgvector/pgvector:pg16 == the official postgres:16 image plus the pgvector
    # extension. Same major version, same data dir layout — an in-place swap for
    # an existing postgres:16-alpine volume. (Note: Debian-based, not Alpine.)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: activitypub
      POSTGRES_USER: apuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuser -d activitypub"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://apuser:${DB_PASSWORD:-changepassword}@db:5432/activitypub
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    # Bind to all interfaces so the central Caddy instance (running in Docker)
    # can reach this via the bridge gateway (172.18.0.1:3000).
    # External access is blocked by the Hetzner cloud firewall.
    ports:
      - "3000:3000"
    # Persist the downloaded embedding model weights (~25 MB) so they are
    # fetched once, not on every container restart.
    volumes:
      - embedding_cache:/app/.cache/embeddings

volumes:
  postgres_data:
  embedding_cache:
