name: bot

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres 16 with its default 128 MB shared_buffers and a small database: 256m is
    # the box's sidecar default (naustet-server template) and leaves headroom.
    mem_limit: 256m
    # Cap the container log: json-file never rotates on its own, and 10m x 3 is also how much output survives an outage of the central log collector (naustet-server ADR 0032).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: activitypub
      POSTGRES_USER: apuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuser -d activitypub"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # The box is small (3.7 GB / 2 vCPU, ~49 containers) and every service is capped.
    # 512m rather than the 256m template default: this is the busiest Node service on
    # the box (two hosts, the ActivityPub inbox, admin, MCP, the image proxy and the
    # sync jobs) and it runs TypeScript through tsx at runtime. The one-off full
    # YouTube archive import (ADR 0047) needs ~500-600 MB of heap by itself and must
    # run outside this cap, not via `docker compose exec app`.
    mem_limit: 512m
    # Cap the container log: json-file never rotates on its own, and 10m x 3 is also how much output survives an outage of the central log collector (naustet-server ADR 0032).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://apuser:${DB_PASSWORD:-changepassword}@db:5432/activitypub
      NODE_ENV: production
    # Proxied images for meg.msge.no. A named volume, not a bind mount and not the
    # container filesystem: a rebuild must not throw the cache away and refetch
    # everything from seven CDNs at once. Bounded by STREAM_IMAGE_CACHE_MB (250 MB
    # by default) — the app sweeps it, Docker does not.
    volumes:
      - image_cache:/data/images
    depends_on:
      db:
        condition: service_healthy
    # Bind to all interfaces so the central Caddy instance (running in Docker)
    # can reach this via the bridge gateway (172.18.0.1:3000).
    # External access is blocked by the Hetzner cloud firewall.
    ports:
      - "3000:3000"
    # main() runs blocking startup syncs before serve() binds the port, so give
    # the probe a generous grace period before failures count. node:22-alpine
    # ships busybox wget; probe the container-internal port 3000.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  postgres_data:
  image_cache:
